<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genshin Model Studio</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1280px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .row { display: flex; gap: 1rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
  textarea { width: 100%; height: 300px; font-family: ui-monospace, monospace; font-size: 12px; box-sizing: border-box; }
  button { padding: 0.5rem 1.2rem; cursor: pointer; }
  .status { color: #555; font-size: 0.9rem; margin-top: 0.5rem; white-space: pre-wrap; }
  .muted { color: #888; font-size: 0.85rem; }
  #githubLink { font-size: 0.85rem; margin-left: 1rem; color: #0a66c2; text-decoration: none; }
  #githubLink:hover { text-decoration: underline; }
  #docs { display: none; width: 100%; height: 560px; border: 1px solid #ccc; border-radius: 4px; margin: 1rem 0; background: #fff; }

  /* ============ 二期：画线建模 ============ */
  .sep { border: none; border-top: 2px solid #dfe5ec; margin: 2.4rem 0 1.4rem; }
  #drawSection h2 { font-size: 1.15rem; margin: 0 0 0.9rem; }
  .draw-layout { display: grid; grid-template-columns: minmax(340px, 5fr) 6fr; gap: 1rem; align-items: stretch; }
  .draw-col { display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.6rem 1.1rem; align-items: center; font-size: 0.9rem; padding: 0.6rem 0.8rem; background: #f6f8fa; border: 1px solid #e1e6ec; border-radius: 6px; }
  .controls label { display: inline-flex; align-items: center; gap: 0.35rem; }
  .controls select, .controls input[type=number] { padding: 0.2rem 0.35rem; font-size: 0.9rem; }
  .controls input[type=range] { width: 130px; }
  #countVal { display: inline-block; min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
  .canvas-box { position: relative; }
  #drawCanvas { display: block; width: 100%; height: 460px; border: 1px solid #2b3542; border-radius: 8px; touch-action: none; background: #10151c; cursor: crosshair; }
  .canvas-hint { position: absolute; right: 10px; top: 10px; color: #9fb0c2; background: rgba(16, 21, 28, 0.72); border-radius: 4px; padding: 3px 8px; font-size: 12px; pointer-events: none; }
  .draw-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .draw-actions input[type=text] { padding: 0.35rem 0.5rem; width: 170px; }
  #drawStatus { color: #555; }
  #drawStatus.err { color: #b23; }
  #drawStatus.ok { color: #2a7a2a; }
  #previewCanvas { display: block; width: 100%; height: 460px; border: 1px solid #2b3542; border-radius: 8px; background: #10151c; }
  .preview-hint { color: #666; font-size: 0.82rem; text-align: center; }

  /* ============ 三期：颜色（色板 / 笔画列表 / 改色弹层） ============ */
  .color-row { display: flex; flex-wrap: wrap; gap: 0.5rem 0.9rem; align-items: center; }
  .color-label { font-weight: 600; }
  .palette { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.75); cursor: pointer; flex: none; box-sizing: border-box; }
  .swatch.on { outline: 2px solid #111; outline-offset: 1px; box-shadow: 0 0 0 3px rgba(255,255,255,0.85); }
  .swatch.default { background: repeating-linear-gradient(45deg, #dfe5ec 0 5px, #b9c2cc 5px 10px); }
  .custom-color { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer; }
  .custom-color input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid #c3ccd6; border-radius: 4px; background: none; cursor: pointer; }
  #currentColorText { font-variant-numeric: tabular-nums; color: #555; }
  .stroke-list { display: flex; flex-wrap: wrap; gap: 0.45rem; padding: 0.5rem 0.7rem; background: #f6f8fa; border: 1px solid #e1e6ec; border-radius: 6px; min-height: 38px; align-items: center; }
  .stroke-list-empty { color: #888; font-size: 0.85rem; }
  .stroke-chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.22rem 0.55rem 0.22rem 0.3rem; border: 1px solid #d4dbe3; background: #fff; border-radius: 999px; cursor: pointer; font-size: 0.82rem; color: #333; user-select: none; }
  .stroke-chip.selected { border-color: #2b6cb0; box-shadow: 0 0 0 2px rgba(43,108,176,0.28); }
  .stroke-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); flex: none; box-sizing: border-box; }
  .stroke-dot.default { background: repeating-linear-gradient(45deg, #dfe5ec 0 3px, #b9c2cc 3px 6px); }
  #colorPopover { position: fixed; z-index: 60; background: #fff; border: 1px solid #c9d2dc; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.18); padding: 0.6rem 0.7rem; display: none; min-width: 210px; }
  #colorPopover .pop-title { font-size: 0.8rem; color: #555; margin-bottom: 0.45rem; }
  #colorPopover .pop-del { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #e6ebf1; }
  #colorPopover .pop-del button { width: 100%; padding: 0.35rem 0.6rem; font-size: 0.82rem; border: 1px solid #d4dbe3; border-radius: 6px; background: #fff; cursor: pointer; }
  #colorPopover .pop-del button:hover { border-color: #b23; color: #b23; }

  /* ============ 四期：几何工具工具栏 / 弹层扩展 / 旋转复制 ============ */
  .tool-row { gap: 0.45rem; }
  .tool-label { font-weight: 600; color: #444; }
  .tool-btn { padding: 0.28rem 0.7rem; border: 1px solid #c9d2dc; background: #fff; border-radius: 6px; font-size: 0.88rem; cursor: pointer; }
  .tool-btn:hover { border-color: #2b6cb0; }
  .tool-btn.on { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  .tool-btn.accent { border-color: #b7791f; color: #8a5a12; }
  .tool-btn.accent:hover { background: #fdf6e3; }
  .tool-sep { width: 1px; height: 20px; background: #d4dbe3; }
  .tool-hint { color: #666; font-size: 0.82rem; flex: 1 1 100%; }
  #drawCanvas.picking { cursor: crosshair; }
  .pop-row { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: #444; }
  .pop-row label { display: inline-flex; align-items: center; gap: 0.45rem; width: 100%; }
  .pop-row select { padding: 0.2rem 0.35rem; font-size: 0.85rem; flex: 1; min-width: 0; }
  .pop-row input[type=number] { padding: 0.2rem 0.35rem; font-size: 0.85rem; width: 84px; }
  .pop-foot { margin-top: 0.5rem; font-size: 0.75rem; color: #999; }
  #rotateModal { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); }
  #rotateModal .modal-box { background: #fff; border-radius: 10px; padding: 1rem 1.2rem; min-width: 270px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .modal-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.7rem; }
  .modal-box label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; }
  .modal-box input[type=number] { width: 72px; padding: 0.3rem 0.4rem; font-size: 0.9rem; }
  .modal-actions { display: flex; gap: 0.6rem; margin-top: 0.9rem; justify-content: flex-end; }
  @media (max-width: 600px) {
    .palette { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
    .stroke-list { flex-wrap: nowrap; overflow-x: auto; }
    .stroke-chip { flex: none; }
  }
  @media (max-width: 900px) {
    .draw-layout { grid-template-columns: 1fr; }
    #drawCanvas, #previewCanvas { height: 320px; }
    textarea { height: 240px; }
  }
  @media (max-width: 600px) {
    textarea { height: 140px; }
    .row { gap: 0.4rem; margin: 0.5rem 0; }
    button { padding: 0.4rem 0.8rem; }
  }
</style>
</head>
<body>
<h1>Genshin Model Studio <span class="muted">— 示例/编辑/导出</span>
  <a id="githubLink" href="https://github.com/TheTouYu/genshin-model-studio" target="_blank" rel="noopener">GitHub 仓库 ↗</a>
</h1>
<div class="row">
  <label>示例：<select id="example"></select></label>
  <label><input type="checkbox" id="compact"> 紧凑显示</label>
  <button id="load">加载</button>
  <button id="toggleDocs">📖 文档</button>
  <select id="docFile">
    <option value="README.md">README</option>
    <option value="docs/input-format.md">输入格式</option>
    <option value="docs/gia-format.md">GIA 格式</option>
  </select>
</div>
<div class="row">
  <button id="exportGil">导出 .gil 候选</button>
  <button id="exportGia">导出 .gia</button>
  <button id="format">格式化</button>
</div>
<textarea id="editor" spellcheck="false"></textarea>
<div class="status" id="status"></div>
<iframe id="docs" title="文档"></iframe>

<hr class="sep">
<section id="drawSection">
  <h2>✏️ 画线建模 <span class="muted">5 种工具（自由/直线/曲线/圆/矩形）→ 上色/参数 → 拟合 → 3D 预览 → 导出 .gil / .gia（作品自动保存在本机）</span></h2>
  <div class="draw-layout">
    <div class="draw-col">
      <div class="controls">
        <label>模式 <select id="mode">
          <option value="extrude">挤出（extrude）</option>
          <option value="lathe">旋转（lathe）</option>
        </select></label>
        <label>形状 <select id="shape">
          <option value="cylinder">圆柱</option>
          <option value="box">方杆</option>
        </select></label>
        <label>尺寸 <input type="number" id="size" min="0.05" max="5" step="0.05" value="0.4"> 米</label>
        <label>数量 <input type="range" id="count" min="10" max="300" step="1" value="60"><span id="countVal">60</span></label>
        <label>模型高 <input type="number" id="height" min="0.5" max="100" step="0.5" value="10"> 米</label>
      </div>
      <div class="controls color-row">
        <span class="color-label">新笔画颜色</span>
        <div class="palette" id="palette"></div>
        <label class="custom-color">自定义 <input type="color" id="customColor" value="#e5484d"><span id="currentColorText">默认材质</span></label>
      </div>
      <div class="controls tool-row" id="toolbar">
        <span class="tool-label">工具</span>
        <button type="button" class="tool-btn on" data-tool="pen" title="自由笔（默认）：拖拽画线，松手拟合">🖊 自由</button>
        <button type="button" class="tool-btn" data-tool="line" title="直线：点起点 → 移动预览 → 点终点">⬜ 直线</button>
        <button type="button" class="tool-btn" data-tool="curve" title="曲线：依次点击控制点（≥2 点实时预览样条），双击完成开放曲线，或点「闭合」封闭">🌀 曲线</button>
        <button type="button" class="tool-btn" data-tool="circle" title="圆：点圆心 → 拖拽定半径 → 松手生成（24 点闭合）">⭕ 圆</button>
        <button type="button" class="tool-btn" data-tool="rect" title="矩形：对角两点 → 生成 4 顶点闭合">▭ 矩形</button>
        <span class="tool-sep"></span>
        <button type="button" class="tool-btn" id="curveClose" hidden>🔗 闭合</button>
        <button type="button" class="tool-btn" id="curveCancel" hidden>✕ 取消</button>
        <button type="button" class="tool-btn accent" id="rotateCopy" hidden title="绕中心均分复制选中笔画">🔁 旋转复制</button>
        <span class="tool-hint" id="toolHint"></span>
      </div>
      <div class="canvas-box">
        <canvas id="drawCanvas"></canvas>
        <span class="canvas-hint" id="canvasHint">画布高 = 1 米</span>
      </div>
      <div class="stroke-list" id="strokeList"></div>
      <div class="draw-actions">
        <button id="undo">↩ 撤销上一笔</button>
        <button id="clear">🗑 清空</button>
        <button id="exportWork">导出作品 JSON</button>
        <button id="importWork">导入作品 JSON</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <div class="status" id="drawStatus">在画布上画线（鼠标或手指），松手自动拟合生成；画完点击笔画圆点可改颜色/渲染/高度/方向</div>
    </div>
    <div class="draw-col">
      <canvas id="previewCanvas"></canvas>
      <div class="preview-hint">3D 预览：拖拽旋转 · 滚轮缩放 · 移动端单指拖拽 / 双指捏合</div>
    </div>
  </div>
  <div class="draw-actions" style="margin-top: 0.8rem;">
    <label>模型名字 <input type="text" id="modelName" value="手绘模型"></label>
    <button id="drawExportGil">导出 .gil</button>
    <button id="drawExportGia">导出 .gia</button>
  </div>
</section>

<div id="colorPopover">
  <div class="pop-title" id="popTitle"></div>
  <div class="palette" id="popPalette"></div>
  <label class="custom-color">自定义 <input type="color" id="popCustom" value="#e5484d"></label>
  <div class="pop-row"><label>渲染 <select id="popRender">
    <option value="">跟随全局（缺省）</option>
    <option value="rod">杆（线）</option>
    <option value="solid">柱体（实体）</option>
  </select></label></div>
  <div class="pop-row"><label>高度（米） <input type="number" id="popHeight" min="0" step="0.01" placeholder="0 = 不抬升"></label></div>
  <div class="pop-row" id="popAxisRow" style="display:none"><label>方向 <select id="popAxis">
    <option value="up">竖直（Y）</option>
    <option value="front">水平（面向观察者）</option>
    <option value="side">侧向（X）</option>
  </select></label></div>
  <div class="pop-foot">改动立即生效：重新生成并更新 3D 预览</div>
  <div class="pop-del"><button type="button" id="popDelete">🗑 删除此笔画</button></div>
</div>

<div id="rotateModal">
  <div class="modal-box">
    <div class="modal-title">🔁 旋转复制</div>
    <label>份数（含原件，2-12）<input type="number" id="rotateCount" min="2" max="12" step="1" value="4"></label>
    <div class="modal-actions">
      <button type="button" id="rotateOk">生成</button>
      <button type="button" id="rotateCancel">取消</button>
    </div>
  </div>
</div>

<script>
// ============ 一期：JSON 编辑 / 示例 / 导出（保持不变） ============
const $ = (id) => document.getElementById(id)
let examples = []

async function loadExamples() {
  const res = await fetch('/api/examples')
  examples = await res.json()
  $('example').innerHTML = examples.map((e) => `<option value="${e.name}">${e.name} (${e.items} 项)</option>`).join('')
  await loadExample(examples[0].name)
}

async function loadExample(name) {
  const res = await fetch(`/api/examples/get?name=${encodeURIComponent(name)}`)
  const data = await res.json()
  $('editor').value = JSON.stringify(data, null, $('compact').checked ? 0 : 2)
  setStatus(`已加载 ${name}`)
}

async function doExport(format) {
  let data
  try {
    data = JSON.parse($('editor').value)
  } catch (e) {
    setStatus(`JSON 解析失败: ${e.message}`)
    return
  }
  const res = await fetch(`/api/export?format=${format}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data }),
  })
  if (!res.ok) {
    setStatus(await res.text())
    return
  }
  const blob = await res.blob()
  const cd = res.headers.get('Content-Disposition') || ''
  const m = cd.match(/filename="([^"]+)"/)
  const name = m ? m[1] : (format === 'gia' ? 'model.gia' : 'model.gil')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = name
  a.click()
  URL.revokeObjectURL(a.href)
  setStatus(`已导出 ${name}（${blob.size} 字节）`)
}

function setStatus(s) { $('status').textContent = s }
function formatJson() {
  try { $('editor').value = JSON.stringify(JSON.parse($('editor').value), null, 2); setStatus('已格式化') }
  catch (e) { setStatus(`JSON 解析失败: ${e.message}`) }
}

function toggleDocs() {
  const frame = $('docs')
  if (frame.style.display === 'none' || !frame.style.display) {
    frame.style.display = 'block'
    frame.src = `/docs?file=${encodeURIComponent($('docFile').value)}`
    $('toggleDocs').textContent = '✕ 关闭文档'
  } else {
    frame.style.display = 'none'
    frame.src = ''
    $('toggleDocs').textContent = '📖 文档'
  }
}

$('load').onclick = () => loadExample($('example').value)
$('exportGil').onclick = () => doExport('gil')
$('exportGia').onclick = () => doExport('gia')
$('format').onclick = formatJson
$('toggleDocs').onclick = toggleDocs
$('docFile').onchange = () => {
  if ($('docs').style.display !== 'none') $('docs').src = `/docs?file=${encodeURIComponent($('docFile').value)}`
}
loadExamples()
</script>

<script src="/draw/preview.js"></script>
<script>
// ============ 二期：画线建模（画布 + 拟合叠加 + 3D 预览 + localStorage + 导出） ============
(function () {
  'use strict'

  const LS_KEY = 'gms.draw.work.v1' // 键名保留历史命名：读旧键即自动迁移 v1 → v2
  const WORK_FORMAT = 'genshin-model-studio.draw'
  const WORK_VERSION = 3 // 四期：strokes 带 render/height/axis（v3 缺省即旧行为）；读入兼容 v1/v2
  // 三期预设色板（12 色 + 默认材质 + 自定义）
  const PALETTE = [
    '0xE5484D', '0xF97316', '0xFACC15', '0x46A758', '0x12A594', '0x3E63DD',
    '0x8E4EC6', '0xE93D82', '0x8B5E3C', '0xE8D8C0', '0x9E9E9E', '0x343A40',
  ]
  const DEBOUNCE_MS = 250
  const SAVE_MS = 500
  // Three.js 多源 CDN fallback（unpkg → jsdelivr；UMD 版以匹配 preview.js 的全局 THREE 用法）
  const CDNS = [
    'https://unpkg.com/three@0.160.0/build/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
  ]

  const el = (id) => document.getElementById(id)
  const drawCanvas = el('drawCanvas')
  const previewCanvas = el('previewCanvas')
  const ctx = drawCanvas.getContext('2d')

  const state = {
    strokes: [], // { id, points: [ [x,y], ... ], color? } 画布 CSS 像素；color = "0xRRGGBB"（缺省 = 默认材质）
    options: { mode: 'extrude', shape: 'cylinder', size: 0.03, count: 60, heightMeters: 1, canvasHeightPx: drawCanvas.clientHeight || 462 }, // currentColor? 新笔画默认色
    selectedId: null, // 选中笔画 id（画布曲线高亮）
    tool: 'pen', // 四期：pen 自由 / line 直线 / curve 曲线 / circle 圆 / rect 矩形
    toolPreview: null, // 四期：橡皮筋预览 { kind: 'line'|'circle'|'rect', a, b }
    curvePts: [], // 四期：曲线工具已点控制点（画布坐标）
    hover: null, // 最近鼠标位置（曲线预览尾线用）
    batches: [], // 撤销批次栈 { len }：旋转复制 N-1 笔 = 一批，一次撤销整体取消
    rotate: null, // 旋转复制进行中：{ strokeId, center: [x,y]|null }
    fitted: [], // 与 strokes 按序对齐：{ id, points, closed } | null（服务端返回）
    closed: [],
    items: [], // 拍平后的 structure items（预览/导出共用）
    preview: null,
    pendingItems: null, // THREE 尚未就绪时暂存
    lastGenError: null, // 五期：最近一次生成错误信息（gms.summary 状态栏文本用）
  }
  let activePointerId = null
  let currentStroke = null
  let seq = 0
  let genTimer = null
  let saveTimer = null
  let genSeq = 0
  let cdnIdx = 0

  /* ---------- 三期颜色工具 ---------- */

  /** 归一化颜色为 "0xRRGGBB"（大写）；非法输入返回 null。 */
  function normalizeColor(v) {
    if (typeof v !== 'string') return null
    const m = v.match(/^(?:#|0x)([0-9a-fA-F]{6})$/)
    return m ? '0x' + m[1].toUpperCase() : null
  }

  function strokeById(id) {
    for (const s of state.strokes) if (s.id === id) return s
    return null
  }

  function currentColor() {
    const c = state.options.currentColor
    return c ? normalizeColor(c) : null
  }

  /* ---------- 画布绘制：网格 + 原始笔画（淡）+ 拟合曲线（亮） ---------- */

  function renderDraw() {
    const w = drawCanvas.clientWidth
    const h = drawCanvas.clientHeight
    if (!w || !h) return
    ctx.clearRect(0, 0, w, h)
    ctx.fillStyle = '#10151c'
    ctx.fillRect(0, 0, w, h)
    // 网格背景
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'
    ctx.lineWidth = 1
    ctx.beginPath()
    for (let x = 0.5; x <= w; x += 25) { ctx.moveTo(x, 0); ctx.lineTo(x, h) }
    for (let y = 0.5; y <= h; y += 25) { ctx.moveTo(0, y); ctx.lineTo(w, y) }
    ctx.stroke()
    // 原始笔画（淡色；选中笔画提亮）
    ctx.lineWidth = 2
    ctx.lineCap = 'round'
    ctx.lineJoin = 'round'
    for (const stroke of state.strokes) {
      const pts = stroke.points
      if (pts.length < 2) continue
      ctx.strokeStyle = stroke.id === state.selectedId ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.38)'
      ctx.beginPath()
      ctx.moveTo(pts[0][0], pts[0][1])
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1])
      ctx.stroke()
    }
    // 拟合曲线：笔画颜色（有 color）或亮色（封闭=青，开放=琥珀）；选中笔画加白色描边高亮
    for (const f of state.fitted) {
      if (!f || f.points.length < 2) continue
      const stroke = strokeById(f.id)
      const strokeColor = stroke && stroke.color ? normalizeColor(stroke.color) : null
      const lineColor = strokeColor ? '#' + strokeColor.slice(2) : (f.closed ? '#6fc3c9' : '#ffd479')
      if (f.id === state.selectedId) {
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'
        ctx.lineWidth = 6
        ctx.beginPath()
        ctx.moveTo(f.points[0][0], f.points[0][1])
        for (let i = 1; i < f.points.length; i++) ctx.lineTo(f.points[i][0], f.points[i][1])
        ctx.stroke()
      }
      ctx.strokeStyle = lineColor
      ctx.lineWidth = 3
      ctx.beginPath()
      ctx.moveTo(f.points[0][0], f.points[0][1])
      for (let i = 1; i < f.points.length; i++) ctx.lineTo(f.points[i][0], f.points[i][1])
      ctx.stroke()
    }
    // 四期：几何工具橡皮筋 / 曲线预览 / 旋转中心标记（最上层）
    drawToolPreview()
  }

  function resizeDraw() {
    const dpr = window.devicePixelRatio || 1
    const w = drawCanvas.clientWidth
    const h = drawCanvas.clientHeight
    if (!w || !h) return
    drawCanvas.width = Math.round(w * dpr)
    drawCanvas.height = Math.round(h * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    renderDraw()
  }

  /* ---------- 笔画输入（Pointer Events + capture，触摸可用） ---------- */

  function toPoint(e) {
    const rect = drawCanvas.getBoundingClientRect()
    return [e.clientX - rect.left, e.clientY - rect.top]
  }

  drawCanvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return
    if (activePointerId !== null) return // 一次只画一笔
    e.preventDefault()
    try { drawCanvas.setPointerCapture(e.pointerId) } catch (err) { /* 忽略捕获失败 */ }
    activePointerId = e.pointerId
    const p = toPoint(e)
    // 旋转复制：点击画布拾取旋转中心
    if (state.rotate && !state.rotate.center) {
      if (!strokeById(state.rotate.strokeId)) { cancelRotate(); return }
      state.rotate.center = p
      openRotateModal()
      return
    }
    if (state.tool === 'pen') {
      startFreehand(p)
    } else if (state.tool === 'line' || state.tool === 'circle' || state.tool === 'rect') {
      state.toolPreview = { kind: state.tool, a: p, b: [p[0], p[1]] } // 橡皮筋起点
    } else if (state.tool === 'curve') {
      addCurvePoint(p)
    }
    renderDraw()
  })

  drawCanvas.addEventListener('pointermove', (e) => {
    const p = toPoint(e)
    state.hover = p
    if (e.pointerId !== activePointerId) {
      // 未在绘制：曲线预览尾线跟随鼠标
      if (state.tool === 'curve' && state.curvePts.length > 0) renderDraw()
      return
    }
    if (currentStroke) {
      const pts = currentStroke.points
      const last = pts[pts.length - 1]
      if (Math.abs(p[0] - last[0]) < 1 && Math.abs(p[1] - last[1]) < 1) return
      pts.push(p)
    } else if (state.toolPreview) {
      state.toolPreview.b = [p[0], p[1]] // 橡皮筋预览
    }
    renderDraw()
  })

  function endStroke(e) {
    if (e.pointerId !== activePointerId) return
    activePointerId = null
    if (currentStroke) {
      autoClose(currentStroke.points) // 自由笔自动闭合：首尾接近 → 拉齐（用户画圈手势）
      state.selectedId = currentStroke.id // 刚画的笔画自动选中，便于立刻改色
      renderStrokeList()
      currentStroke = null
      scheduleGen()
    } else if (state.toolPreview) {
      const tp = state.toolPreview
      state.toolPreview = null
      commitToolShape(tp) // 直线/圆/矩形：松手生成笔画
    }
    renderDraw()
  }
  drawCanvas.addEventListener('pointerup', endStroke)
  drawCanvas.addEventListener('pointercancel', endStroke)

  drawCanvas.addEventListener('dblclick', (e) => {
    if (state.tool !== 'curve') return
    // 双击完成：第二次点击已把光标处加为控制点，移除后按开放曲线提交
    if (state.curvePts.length >= 2) state.curvePts.pop()
    finishCurve(false)
  })

  function startFreehand(p) {
    currentStroke = { id: 's' + Date.now().toString(36) + '_' + seq++, points: [p] }
    const cc = currentColor()
    if (cc) currentStroke.color = cc // 新笔画自动用当前选中色
    state.strokes.push(currentStroke)
    state.fitted.push(null)
    state.closed.push(false)
    state.batches.push({ len: 1 })
  }

  function addCurvePoint(p) {
    state.curvePts.push([p[0], p[1]])
    updateToolbar()
  }

  /* ---------- 四期：几何工具（直线/圆/矩形/曲线 + 工具栏） ---------- */

  const TOOL_HINTS = {
    pen: '自由笔：按住拖拽画线，松手自动拟合',
    line: '直线：点击起点 → 移动预览 → 点击终点',
    circle: '圆：点击圆心 → 拖拽预览半径 → 松手生成（24 点闭合圆）',
    rect: '矩形：点击对角起点 → 拖拽预览 → 松手生成（4 顶点闭合）',
    curve: '曲线：依次点击控制点（≥2 点实时预览样条）→ 双击完成开放曲线，或点「🔗 闭合」封闭',
  }
  const MIN_GEO_SIZE = 3 // 像素：小于此尺寸的点击按误触忽略

  function updateToolbar() {
    document.querySelectorAll('.tool-btn[data-tool]').forEach((btn) => {
      btn.classList.toggle('on', btn.dataset.tool === state.tool)
    })
    el('curveClose').hidden = !(state.tool === 'curve' && state.curvePts.length >= 2)
    el('curveCancel').hidden = !(state.tool === 'curve' && state.curvePts.length >= 1)
    el('rotateCopy').hidden = !state.selectedId // 选中笔画（chip 高亮）时出现
    drawCanvas.classList.toggle('picking', !!(state.rotate && !state.rotate.center))
    if (state.rotate && !state.rotate.center) {
      el('toolHint').textContent = '已进入旋转复制：请在画布上点击旋转中心'
    } else if (state.tool === 'curve' && state.curvePts.length >= 1) {
      el('toolHint').textContent = state.curvePts.length >= 2
        ? `曲线：${state.curvePts.length} 个控制点，预览中 · 双击完成 / 点「🔗 闭合」封闭`
        : `曲线：${state.curvePts.length} 个控制点，再点至少 1 个（≥2 点开始预览）`
    } else {
      el('toolHint').textContent = TOOL_HINTS[state.tool]
    }
  }

  function setTool(tool) {
    if (state.tool === tool) return
    if (state.tool === 'curve' && state.curvePts.length >= 2) {
      finishCurve(false) // 切工具时曲线 ≥2 点 → 按开放曲线提交（不丢已点控制点）
    } else if (state.tool === 'curve') {
      cancelCurve()
    }
    if (state.rotate && !state.rotate.center) cancelRotate()
    state.tool = tool
    state.toolPreview = null
    updateToolbar()
    setStatus(TOOL_HINTS[tool])
    renderDraw()
  }

  document.querySelectorAll('.tool-btn[data-tool]').forEach((btn) => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool))
  })
  el('curveClose').addEventListener('click', () => finishCurve(true))
  el('curveCancel').addEventListener('click', cancelCurve)

  /** 工具生成的笔画 = 普通笔画对象（points + 颜色），走现有保存/生成/撤销全流程。 */
  /** 自动闭合：首尾距离 < 对角线 20%（用户画圈手势的容差）→ 末尾点拉齐到起点，
   *  使后端封闭检测（3%）命中；几何工具（圆/矩形/闭合曲线）已首尾同点，不受影响。 */
  function autoClose(pts) {
    if (!pts || pts.length < 3) return false
    const first = pts[0]
    const last = pts[pts.length - 1]
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
    for (const [x, y] of pts) {
      if (x < minX) minX = x
      if (y < minY) minY = y
      if (x > maxX) maxX = x
      if (y > maxY) maxY = y
    }
    const diag = Math.hypot(maxX - minX, maxY - minY)
    if (diag > 0 && Math.hypot(first[0] - last[0], first[1] - last[1]) < diag * 0.2) {
      pts[pts.length - 1] = [first[0], first[1]]
      return true
    }
    return false
  }

  function addStroke(points) {
    const stroke = { id: 's' + Date.now().toString(36) + '_' + seq++, points }
    const cc = currentColor()
    if (cc) stroke.color = cc // 新笔画自动用当前选中色
    state.strokes.push(stroke)
    state.fitted.push(null)
    state.closed.push(false)
    state.batches.push({ len: 1 })
    state.selectedId = stroke.id // 刚生成的笔画自动选中，便于改参数/旋转复制
    renderStrokeList()
    renderDraw()
    scheduleGen()
    return stroke
  }

  /** 直线/圆/矩形松手提交：生成规则与自由笔同构（闭合标记沿用现有服务端 closed 检测）。 */
  function commitToolShape(tp) {
    let points = null
    if (tp.kind === 'line') {
      if (Math.hypot(tp.b[0] - tp.a[0], tp.b[1] - tp.a[1]) < MIN_GEO_SIZE) return
      points = [[tp.a[0], tp.a[1]], [tp.b[0], tp.b[1]]]
    } else if (tp.kind === 'circle') {
      const r = Math.hypot(tp.b[0] - tp.a[0], tp.b[1] - tp.a[1])
      if (r < MIN_GEO_SIZE) return
      const cx = tp.a[0], cy = tp.a[1]
      const N = 24 // 等距点圆
      points = []
      for (let i = 0; i < N; i++) {
        const a = (2 * Math.PI * i) / N
        points.push([cx + r * Math.cos(a), cy + r * Math.sin(a)])
      }
      points.push([points[0][0], points[0][1]]) // 闭合点：首尾重合 → 服务端 closed 检测命中
    } else if (tp.kind === 'rect') {
      if (Math.abs(tp.b[0] - tp.a[0]) < MIN_GEO_SIZE && Math.abs(tp.b[1] - tp.a[1]) < MIN_GEO_SIZE) return
      const x0 = Math.min(tp.a[0], tp.b[0]), y0 = Math.min(tp.a[1], tp.b[1])
      const x1 = Math.max(tp.a[0], tp.b[0]), y1 = Math.max(tp.a[1], tp.b[1])
      points = [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]] // 4 顶点 + 闭合点
    }
    if (points) addStroke(points)
  }

  /** 浏览器端 Catmull-Rom 点（画布预览/采样用，不上送；最终笔画 = 采样点序列，与后端算法同构）。 */
  function catmullRomPoint(p0, p1, p2, p3, t) {
    const t2 = t * t
    const t3 = t2 * t
    return [
      0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
      0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
    ]
  }

  /**
   * Catmull-Rom 采样：经过所有控制点、C1 连续；perSeg = 每段采样数（默认 24）。
   * 开放曲线末点 = 末控制点；闭合曲线环绕一周且末点 = 首控制点（服务端 closed 检测直接命中）。
   * 2 个控制点时退化为直线（重复端点参与 Catmull-Rom 会产生 S 形，必须特判）。
   */
  function sampleCatmullRom(controls, closed, perSeg = 24) {
    const n = controls.length
    if (n === 0) return []
    if (n === 1) return [[controls[0][0], controls[0][1]]]
    if (n === 2) {
      const [a, b] = controls
      if (!closed) {
        const out = []
        for (let j = 0; j < perSeg; j++) {
          const t = j / perSeg
          out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t])
        }
        out.push([b[0], b[1]])
        return out
      }
      return [[a[0], a[1]], [b[0], b[1]], [a[0], a[1]]]
    }
    const out = []
    const segs = closed ? n : n - 1
    for (let i = 0; i < segs; i++) {
      const p0 = controls[(i - 1 + n) % n]
      const p1 = controls[i]
      const p2 = controls[(i + 1) % n]
      const p3 = controls[(i + 2) % n]
      for (let j = 0; j < perSeg; j++) {
        out.push(catmullRomPoint(p0, p1, p2, p3, j / perSeg))
      }
    }
    const end = closed ? controls[0] : controls[n - 1]
    out.push([end[0], end[1]])
    return out
  }

  function finishCurve(closed) {
    if (state.tool !== 'curve') return
    const pts = state.curvePts
    if (pts.length < 2) {
      setStatus('曲线至少需要 2 个控制点', 'err')
      return
    }
    const sampled = sampleCatmullRom(pts, closed) // 最终笔画 = 采样点序列
    state.curvePts = []
    setStatus(`✓ 曲线已完成（${pts.length} 个控制点，${closed ? '封闭' : '开放'}）`, 'ok')
    addStroke(sampled)
  }

  function cancelCurve() {
    if (state.tool !== 'curve' || state.curvePts.length === 0) return
    state.curvePts = []
    updateToolbar()
    renderDraw()
    setStatus('曲线已取消')
  }

  /** 画布叠加层（最上层，青色）：橡皮筋 / 曲线控制点+预览样条 / 旋转中心标记。 */
  function drawToolPreview() {
    ctx.save()
    ctx.lineWidth = 2
    ctx.lineCap = 'round'
    const cyan = '#6fc3c9'
    const tp = state.toolPreview
    if (tp) {
      ctx.strokeStyle = cyan
      ctx.setLineDash([])
      if (tp.kind === 'line') {
        ctx.beginPath()
        ctx.moveTo(tp.a[0], tp.a[1])
        ctx.lineTo(tp.b[0], tp.b[1])
        ctx.stroke()
      } else if (tp.kind === 'circle') {
        const r = Math.hypot(tp.b[0] - tp.a[0], tp.b[1] - tp.a[1])
        ctx.beginPath()
        ctx.arc(tp.a[0], tp.a[1], r, 0, Math.PI * 2)
        ctx.stroke()
        ctx.setLineDash([3, 3])
        ctx.beginPath()
        ctx.moveTo(tp.a[0] - 8, tp.a[1]); ctx.lineTo(tp.a[0] + 8, tp.a[1])
        ctx.moveTo(tp.a[0], tp.a[1] - 8); ctx.lineTo(tp.a[0], tp.a[1] + 8)
        ctx.stroke()
      } else if (tp.kind === 'rect') {
        const x0 = Math.min(tp.a[0], tp.b[0]), y0 = Math.min(tp.a[1], tp.b[1])
        const x1 = Math.max(tp.a[0], tp.b[0]), y1 = Math.max(tp.a[1], tp.b[1])
        ctx.strokeRect(x0, y0, x1 - x0, y1 - y0)
      }
    }
    // 曲线工具：控制点 + 经过控制点的平滑样条预览 + 尾线
    if (state.tool === 'curve' && state.curvePts.length > 0) {
      ctx.strokeStyle = cyan
      ctx.fillStyle = cyan
      ctx.setLineDash([])
      for (const p of state.curvePts) {
        ctx.beginPath()
        ctx.arc(p[0], p[1], 3.5, 0, Math.PI * 2)
        ctx.fill()
      }
      if (state.curvePts.length >= 2) {
        const spline = sampleCatmullRom(state.curvePts, false)
        ctx.beginPath()
        ctx.moveTo(spline[0][0], spline[0][1])
        for (let i = 1; i < spline.length; i++) ctx.lineTo(spline[i][0], spline[i][1])
        ctx.stroke()
        if (state.hover) {
          const last = state.curvePts[state.curvePts.length - 1]
          ctx.setLineDash([5, 4])
          ctx.strokeStyle = 'rgba(111,195,201,0.55)'
          ctx.beginPath()
          ctx.moveTo(last[0], last[1])
          ctx.lineTo(state.hover[0], state.hover[1])
          ctx.stroke()
        }
      }
    }
    // 旋转复制：已选中心标记
    if (state.rotate && state.rotate.center) {
      const cx = state.rotate.center[0], cy = state.rotate.center[1]
      ctx.strokeStyle = '#ffd479'
      ctx.setLineDash([])
      ctx.beginPath()
      ctx.arc(cx, cy, 7, 0, Math.PI * 2)
      ctx.moveTo(cx - 11, cy); ctx.lineTo(cx + 11, cy)
      ctx.moveTo(cx, cy - 11); ctx.lineTo(cx, cy + 11)
      ctx.stroke()
    }
    ctx.restore()
  }

  /* ---------- 拟合生成（防抖调 /api/draw-model） ---------- */

  function scheduleGen() {
    clearTimeout(genTimer)
    genTimer = setTimeout(regenerate, DEBOUNCE_MS)
  }

  function regenerate() {
    clearTimeout(genTimer)
    const mySeq = ++genSeq
    state.lastGenError = null // 五期：新一轮生成开始，清空上次错误（gms.summary 用）
    if (state.strokes.length === 0) {
      state.items = []
      state.fitted = []
      state.closed = []
      applyPreview(null)
      saveLocal()
      renderDraw()
      setStatus('画布已清空：在画布上画线开始')
      return
    }
    setStatus('拟合生成中…')
    fetch('/api/draw-model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ strokes: state.strokes, options: state.options }),
    })
      .then((res) => {
        if (res.ok) return res.json()
        const ct = (res.headers.get('content-type') || '').toLowerCase()
        // 仅后端业务错误（400 text/plain|json，如“笔画不能为空”）展示原文；
        // 其他（含 Vercel 404 的 text/plain 或 text/html 页面）不把正文塞进状态栏
        const isBusinessError = res.status === 400 && (ct.includes('application/json') || ct.includes('text/plain'))
        if (isBusinessError) {
          return res.text().then((t) => { throw new Error(t) })
        }
        throw new Error(`生成接口异常（HTTP ${res.status}）`)
      })
      .then((data) => {
        if (mySeq !== genSeq) return // 丢弃过期响应
        state.items = data.items || []
        state.fitted = data.fitted || []
        state.closed = data.closed || []
        renderDraw()
        applyPreview(state.items)
        saveLocal()
        const closedCount = state.closed.filter(Boolean).length
        setStatus(`✓ ${state.strokes.length} 笔 · ${closedCount} 笔封闭 · ${state.items.length} 个元件`, 'ok')
      })
      .catch((err) => {
        if (mySeq !== genSeq) return
        state.lastGenError = err.message // 五期：记录生成错误（gms.summary 用）
        setStatus('生成失败：' + err.message, 'err')
      })
  }

  function applyPreview(items) {
    if (state.preview) state.preview.setItems(items)
    else state.pendingItems = items
  }

  /* ---------- 控制面板 ---------- */

  function updateShapeDisabled() {
    el('shape').disabled = state.options.mode === 'lathe'
  }

  function updateHint() {
    el('canvasHint').textContent = '画布高 = ' + state.options.heightMeters + ' 米'
  }

  function syncControls() {
    el('mode').value = state.options.mode
    el('shape').value = state.options.shape
    el('size').value = state.options.size
    el('count').value = state.options.count
    el('countVal').textContent = state.options.count
    el('height').value = state.options.heightMeters
    updateShapeDisabled()
    updateHint()
  }

  function onOptionChange() {
    const mode = el('mode').value
    const shape = el('shape').value
    const size = parseFloat(el('size').value)
    const count = parseInt(el('count').value, 10)
    const heightMeters = parseFloat(el('height').value)
    el('countVal').textContent = el('count').value
    if (!Number.isFinite(size) || !Number.isFinite(count) || !Number.isFinite(heightMeters)) {
      return // 输入未完成，等下一个事件
    }
    state.options = { mode, shape, size, count, heightMeters, canvasHeightPx: drawCanvas.clientHeight || 462 }
    updateShapeDisabled()
    updateHint()
    scheduleGen()
  }

  el('mode').addEventListener('change', onOptionChange)
  el('shape').addEventListener('change', onOptionChange)
  el('size').addEventListener('input', onOptionChange)
  el('count').addEventListener('input', onOptionChange)
  el('height').addEventListener('input', onOptionChange)

  /* ---------- 撤销 / 清空 ---------- */

  el('undo').addEventListener('click', () => {
    if (state.strokes.length === 0) { setStatus('没有可撤销的笔画'); return }
    // 撤销按批次：旋转复制 N-1 笔为一批，一次撤销整体取消
    const batch = state.batches.pop() || { len: 1 }
    const len = Math.min(batch.len, state.strokes.length)
    state.strokes.splice(state.strokes.length - len, len)
    state.fitted.splice(state.fitted.length - len, len)
    state.closed.splice(state.closed.length - len, len)
    ensureSelection()
    renderStrokeList()
    renderDraw()
    scheduleGen()
  })

  el('clear').addEventListener('click', () => {
    if (state.strokes.length === 0) return
    state.strokes = []
    state.fitted = []
    state.closed = []
    state.batches = []
    state.selectedId = null
    renderStrokeList()
    renderDraw()
    scheduleGen()
  })

  /* ---------- 三期：色板 / 笔画列表 / 改色 ---------- */

  function swatchHTML(color, on, isDefault) {
    const style = color ? `background:#${color.slice(2)}` : ''
    return `<span class="swatch ${isDefault ? 'default ' : ''}${on ? 'on' : ''}" data-color="${color || ''}" style="${style}" title="${color || '默认材质'}"></span>`
  }

  /* ---- 主色板：设定新笔画默认色 ---- */

  function renderMainPalette() {
    const cur = currentColor()
    el('palette').innerHTML = swatchHTML(null, !cur, true) + PALETTE.map((c) => swatchHTML(c, cur === c)).join('')
    el('customColor').value = cur ? '#' + cur.slice(2) : '#e5484d'
    el('currentColorText').textContent = cur ? cur : '默认材质'
  }

  function setCurrentColor(color) {
    if (color) state.options.currentColor = color
    else delete state.options.currentColor
    renderMainPalette()
  }

  el('palette').addEventListener('click', (e) => {
    const sw = e.target.closest('.swatch')
    if (!sw) return
    setCurrentColor(sw.dataset.color ? normalizeColor(sw.dataset.color) : null)
  })

  el('customColor').addEventListener('input', (e) => {
    const c = normalizeColor(e.target.value)
    if (c) setCurrentColor(c)
  })

  /* ---- 笔画列表：点圆点 = 选中该笔 + 弹色板 ---- */

  function renderStrokeList() {
    const list = el('strokeList')
    if (state.strokes.length === 0) {
      list.innerHTML = '<span class="stroke-list-empty">还没有笔画：画线后这里列出每一笔，点击圆点可改该笔颜色/渲染/高度/方向</span>'
      updateToolbar()
      return
    }
    list.innerHTML = state.strokes
      .map((s, i) => {
        const on = s.id === state.selectedId
        const dot = s.color
          ? `<span class="stroke-dot" data-id="${s.id}" style="background:#${s.color.slice(2)}"></span>`
          : `<span class="stroke-dot default" data-id="${s.id}"></span>`
        return `<span class="stroke-chip${on ? ' selected' : ''}" data-id="${s.id}">${dot}<span class="stroke-name">笔画 ${i + 1}</span></span>`
      })
      .join('')
    updateToolbar()
  }

  function selectStroke(id) {
    state.selectedId = id
    if (state.rotate && state.rotate.strokeId !== id) cancelRotate() // 换了目标则取消进行中的旋转复制
    renderStrokeList()
    renderDraw()
  }

  function ensureSelection() {
    if (state.selectedId && !strokeById(state.selectedId)) state.selectedId = null
  }

  el('strokeList').addEventListener('click', (e) => {
    const chip = e.target.closest('.stroke-chip')
    if (!chip) return
    selectStroke(chip.dataset.id)
    openPopover(chip.dataset.id, e.target.closest('.stroke-dot') || chip)
  })

  /* ---- 改色弹层（点笔画圆点弹出；选色后立即重新生成 + 预览更新） ---- */

  function openPopover(strokeId, anchor) {
    const pop = el('colorPopover')
    const stroke = strokeById(strokeId)
    if (!stroke) return
    const cur = normalizeColor(stroke.color)
    el('popTitle').textContent = '笔画 ' + (state.strokes.indexOf(stroke) + 1) + ' 设置（点外部关闭）'
    el('popPalette').innerHTML = swatchHTML(null, !cur, true) + PALETTE.map((c) => swatchHTML(c, cur === c)).join('')
    el('popCustom').value = cur ? '#' + cur.slice(2) : '#e5484d'
    // 四期：渲染参数（缺省不写字段 = 跟随全局/0 抬升/竖直）
    el('popRender').value = stroke.render || ''
    el('popHeight').value = stroke.height !== undefined ? String(stroke.height) : ''
    el('popAxis').value = stroke.axis || 'up'
    updateAxisRow()
    pop.dataset.strokeId = strokeId
    pop.style.display = 'block'
    const r = anchor.getBoundingClientRect()
    const w = pop.offsetWidth
    let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8)
    let top = r.bottom + 8
    if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 8)
    pop.style.left = left + 'px'
    pop.style.top = top + 'px'
  }

  function closePopover() {
    el('colorPopover').style.display = 'none'
  }

  function setStrokeColor(strokeId, color) {
    const stroke = strokeById(strokeId)
    if (!stroke) return
    if (color) stroke.color = color
    else delete stroke.color
    renderStrokeList()
    renderDraw()
    scheduleGen() // 改色后重新生成 + 预览更新
  }

  el('popPalette').addEventListener('click', (e) => {
    const sw = e.target.closest('.swatch')
    if (!sw) return
    const id = el('colorPopover').dataset.strokeId
    setStrokeColor(id, sw.dataset.color ? normalizeColor(sw.dataset.color) : null)
  })

  el('popCustom').addEventListener('input', (e) => {
    const c = normalizeColor(e.target.value)
    if (!c) return
    setStrokeColor(el('colorPopover').dataset.strokeId, c)
  })

  /* ---- 四期：渲染参数改动 → 立即重新生成 + 预览更新（与改色同流程） ---- */

  function updateAxisRow() {
    el('popAxisRow').style.display = el('popRender').value === 'solid' ? '' : 'none' // 方向仅柱体有效
  }

  el('popRender').addEventListener('change', (e) => {
    const s = strokeById(el('colorPopover').dataset.strokeId)
    if (!s) return
    const v = e.target.value
    if (v === 'rod' || v === 'solid') {
      s.render = v
      if (v !== 'solid' && s.axis) delete s.axis // axis 仅 render='solid' 有效
    } else {
      delete s.render // 跟随全局（缺省不写）
      if (s.axis) delete s.axis
    }
    updateAxisRow()
    renderStrokeList()
    renderDraw()
    scheduleGen()
  })

  el('popHeight').addEventListener('input', (e) => {
    const s = strokeById(el('colorPopover').dataset.strokeId)
    if (!s) return
    const v = parseFloat(e.target.value)
    if (Number.isFinite(v) && v > 0) s.height = v // 高度 > 0 才写；缺省 0（不抬升）不写字段
    else delete s.height
    renderStrokeList()
    renderDraw()
    scheduleGen()
  })

  el('popAxis').addEventListener('change', (e) => {
    const s = strokeById(el('colorPopover').dataset.strokeId)
    if (!s) return
    const v = e.target.value
    if (v === 'front' || v === 'side') s.axis = v // 'up' = 缺省（竖直），不写字段
    else delete s.axis
    renderStrokeList()
    renderDraw()
    scheduleGen()
  })

  /* ---- 五期：弹层删除按钮（删除 dataset.strokeId 对应笔画并关弹层） ---- */

  el('popDelete').addEventListener('click', () => {
    const id = el('colorPopover').dataset.strokeId
    closePopover()
    if (id && deleteStrokeById(id)) setStatus('已删除该笔画', 'ok')
  })

  document.addEventListener('pointerdown', (e) => {
    const pop = el('colorPopover')
    if (pop.style.display === 'none') return
    if (pop.contains(e.target)) return
    if (e.target.closest && e.target.closest('.stroke-dot')) return // 点圆点由列表点击处理器重新打开
    closePopover()
  })

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return
    if (state.tool === 'curve' && state.curvePts.length > 0) { cancelCurve(); return }
    if (state.rotate) { cancelRotate(); return }
    closePopover()
  })

  window.addEventListener('scroll', closePopover, true)

  /* ---------- 四期：旋转复制（选中笔画 → 点旋转中心 → 份数 → N-1 副本） ---------- */

  el('rotateCopy').addEventListener('click', () => {
    if (!state.selectedId) return
    if (state.rotate) { cancelRotate(); return }
    state.rotate = { strokeId: state.selectedId, center: null }
    updateToolbar()
    setStatus('旋转复制：请在画布上点击旋转中心（十字光标）')
  })

  function cancelRotate() {
    if (el('rotateModal').style.display !== 'none') el('rotateModal').style.display = 'none'
    state.rotate = null
    updateToolbar()
  }

  function openRotateModal() {
    el('rotateCount').value = '4' // 默认 4 份
    el('rotateModal').style.display = 'flex'
    el('rotateCount').focus()
    el('rotateCount').select()
  }

  function closeRotateModal() {
    el('rotateModal').style.display = 'none'
  }

  /** 副本继承源笔画全部参数（color/render/height/axis），绕 center 均分 360°/n；
   *  副本另记录画布旋转角 angle（弧度，绕旋转中心），供服务端 solidColumn 把朝向
   *  编码进元件 rotation 的绕 Y 分量（叶片旋转副本 0/120/240 辐向）。 */
  function makeRotationCopies(src, center, n) {
    const cx = center[0], cy = center[1]
    const copies = []
    for (let k = 1; k < n; k++) {
      const theta = (2 * Math.PI * k) / n
      const cos = Math.cos(theta), sin = Math.sin(theta)
      const stroke = {
        id: 's' + Date.now().toString(36) + '_' + seq++,
        points: src.points.map((p) => [
          cx + (p[0] - cx) * cos - (p[1] - cy) * sin,
          cy + (p[0] - cx) * sin + (p[1] - cy) * cos,
        ]),
      }
      autoClose(stroke.points) // 源闭合（首尾同点）时副本旋转后首尾被拉开 → 重新拉齐
      if (src.color) stroke.color = src.color
      if (src.render) stroke.render = src.render
      if (src.height !== undefined) stroke.height = src.height
      if (src.lift !== undefined) stroke.lift = src.lift // 离地抬升同样透传（叶片副本与源同高度）
      if (src.axis) stroke.axis = src.axis
      // 画布旋转角累加记录（弧度）：源缺省 0，副本 = 源角 + θ；旋转椭圆主轴方向随副本转动
      stroke.angle = (src.angle ?? 0) + theta
      copies.push(stroke)
    }
    return copies
  }

  function confirmRotate() {
    const r = state.rotate
    closeRotateModal()
    state.rotate = null
    if (!r || !r.center) return
    const src = strokeById(r.strokeId)
    if (!src) { updateToolbar(); setStatus('旋转复制取消：源笔画不存在', 'err'); return }
    const n = Math.min(12, Math.max(2, Math.round(Number(el('rotateCount').value) || 4)))
    const copies = makeRotationCopies(src, r.center, n)
    if (copies.length === 0) return
    const idx = state.strokes.indexOf(src)
    state.strokes.splice(idx + 1, 0, ...copies) // 副本插入到源笔画之后
    state.fitted.splice(idx + 1, 0, ...copies.map(() => null))
    state.closed.splice(idx + 1, 0, ...copies.map(() => false))
    state.batches.push({ len: copies.length }) // 一个批次：一次撤销整体取消
    state.selectedId = src.id
    renderStrokeList()
    renderDraw()
    scheduleGen()
    setStatus(`✓ 旋转复制完成：绕中心均分 ${n} 份（新增 ${copies.length} 笔副本，可一次撤销）`, 'ok')
  }

  el('rotateOk').addEventListener('click', confirmRotate)
  el('rotateCancel').addEventListener('click', cancelRotate)
  el('rotateModal').addEventListener('click', (e) => { if (e.target === el('rotateModal')) cancelRotate() })
  el('rotateCount').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmRotate()
    if (e.key === 'Escape') cancelRotate()
  })

  /* ---------- localStorage 自动保存 / 恢复 ---------- */

  function saveLocal() {
    clearTimeout(saveTimer)
    saveTimer = setTimeout(() => {
      try {
        // v3：{ version, strokes, options }；新字段仅在非缺省时写入（由笔画对象自身保证）
        localStorage.setItem(LS_KEY, JSON.stringify({
          version: WORK_VERSION,
          strokes: state.strokes,
          options: state.options,
        }))
      } catch (e) { /* 隐私模式等场景忽略 */ }
    }, SAVE_MS)
  }

  function sanitizePoints(points) {
    const out = []
    if (!Array.isArray(points)) return out
    for (const p of points) {
      if (Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1])) out.push([p[0], p[1]])
    }
    return out
  }

  /** 应用作品（本地存档或导入文件）。返回是否成功。 */
  function applyWork(data, silent) {
    if (!data || typeof data !== 'object') return false
    const ver = data.version
    if (ver === 1 || ver === 2) {
      if (data.format !== WORK_FORMAT) return false // v1/v2 带 format 标记
    } else if (ver !== 3) {
      return false // v3 起按 PRD §4 契约：{ version, strokes, options }
    }
    if (!Array.isArray(data.strokes)) return false
    const o = data.options || {}
    const opts = {
      mode: o.mode === 'lathe' ? 'lathe' : 'extrude',
      shape: o.shape === 'box' ? 'box' : 'cylinder',
      size: Number.isFinite(o.size) && o.size > 0 ? o.size : 0.03,
      count: Number.isFinite(o.count) ? Math.min(300, Math.max(10, Math.round(o.count))) : 60,
      heightMeters: Number.isFinite(o.heightMeters) && o.heightMeters > 0 ? o.heightMeters : 1,
    }
    // 四期尺寸标定迁移：旧默认（画布高 10 米 / 杆径 0.4 米）改 1 米 / 3cm（PRD §4 标定）——
    // 未改过参数的旧作品自动迁移，避免“画个小圆变成 10 米巨柱”
    if (opts.heightMeters === 10) opts.heightMeters = 1
    if (opts.size === 0.4) opts.size = 0.03
    // 四期画布标定：读入作品统一按画布可视区标定（缺省补当前画布高；旧作品同样迁移）
    opts.canvasHeightPx =
      Number.isFinite(o.canvasHeightPx) && o.canvasHeightPx > 0
        ? o.canvasHeightPx
        : drawCanvas.clientHeight || 462
    const cur = normalizeColor(o.currentColor)
    if (cur) opts.currentColor = cur // v2：无/非法 currentColor = 默认材质
    state.strokes = data.strokes
      .filter((s) => s && typeof s.id === 'string' && Array.isArray(s.points) && sanitizePoints(s.points).length > 0)
      .map((s) => {
        const out = { id: s.id, points: sanitizePoints(s.points) }
        const color = normalizeColor(s.color) // v1 无 color 字段 = 默认材质
        if (color) out.color = color
        // v3 增量字段（缺省即旧行为；仅接受合法值，默认值不写字段）
        if (s.render === 'rod' || s.render === 'solid') out.render = s.render
        if (typeof s.height === 'number' && Number.isFinite(s.height) && s.height > 0) out.height = s.height
        if (out.render === 'solid' && (s.axis === 'front' || s.axis === 'side')) out.axis = s.axis // 'up'=缺省不写
        return out
      })
    state.batches = state.strokes.map(() => ({ len: 1 })) // 导入/恢复后每笔一个撤销批次
    state.options = opts
    state.selectedId = null
    syncControls()
    renderMainPalette()
    renderStrokeList()
    if (!silent) setStatus(`已导入作品：${state.strokes.length} 笔笔画`, 'ok')
    scheduleGen()
    return true
  }

  function restoreLocal() {
    let raw = null
    try { raw = localStorage.getItem(LS_KEY) } catch (e) { return false }
    if (!raw) return false
    try { return applyWork(JSON.parse(raw), true) } catch (e) { return false }
  }

  /* ---------- 作品 JSON 导入 / 导出 ---------- */

  function download(filename, blob) {
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = filename
    a.click()
    setTimeout(() => URL.revokeObjectURL(a.href), 1000)
  }

  el('exportWork').addEventListener('click', () => {
    const work = {
      version: WORK_VERSION, // v3：{ version, strokes, options }（PRD §4；format 字段由 v1/v2 引入，v3 起不再写）
      strokes: state.strokes,
      options: state.options,
    }
    download('draw-work.json', new Blob([JSON.stringify(work, null, 2)], { type: 'application/json' }))
    setStatus(`已导出作品 JSON v${WORK_VERSION}（${state.strokes.length} 笔笔画）`, 'ok')
  })

  el('importWork').addEventListener('click', () => el('importFile').click())
  el('importFile').addEventListener('change', () => {
    const file = el('importFile').files && el('importFile').files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result))
        if (!applyWork(data)) setStatus('导入失败：不是有效的作品 JSON（版本/格式不匹配）', 'err')
      } catch (e) {
        setStatus('导入失败：' + e.message, 'err')
      }
      el('importFile').value = ''
    }
    reader.readAsText(file)
  })

  /* ---------- 导出 .gil / .gia（复用 /api/export，一期管线） ---------- */

  function downloadNameFromCd(cd, fallback) {
    if (!cd) return fallback
    const mStar = cd.match(/filename\*=UTF-8''([^;]+)/i)
    if (mStar) { try { return decodeURIComponent(mStar[1]) } catch (e) { /* 继续 */ } }
    const m = cd.match(/filename="([^"]+)"/)
    return m ? m[1] : fallback
  }

  function doModelExport(format) {
    if (!state.items || state.items.length === 0) {
      setStatus('还没有可导出的模型：请先在画布上画线生成', 'err')
      return
    }
    const name = (el('modelName').value || '').trim() || '手绘模型'
    fetch('/api/export?format=' + format, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: { name, items: state.items } }),
    })
      .then((res) => {
        if (!res.ok) return res.text().then((t) => { throw new Error(t) })
        return res.blob().then((blob) => ({ blob, cd: res.headers.get('Content-Disposition') || '' }))
      })
      .then(({ blob, cd }) => {
        const filename = downloadNameFromCd(cd, format === 'gia' ? 'model.gia' : 'model.gil')
        download(filename, blob)
        setStatus(`已导出 ${filename}（${blob.size} 字节）`, 'ok')
      })
      .catch((err) => setStatus('导出失败：' + err.message, 'err'))
  }

  el('drawExportGil').addEventListener('click', () => doModelExport('gil'))
  el('drawExportGia').addEventListener('click', () => doModelExport('gia'))

  /* ---------- 3D 预览：Three.js CDN fallback + preview.js ---------- */

  function setStatus(msg, cls) {
    const s = el('drawStatus')
    s.textContent = msg
    s.className = 'status' + (cls ? ' ' + cls : '')
  }

  function bootPreview() {
    if (typeof window.createPreview !== 'function') {
      setStatus('preview.js 未加载（/draw/preview.js）', 'err')
      return
    }
    try {
      state.preview = window.createPreview(previewCanvas)
      window.gmsPreview = state.preview // 五期：暴露预览控制 API（setCamera/resetView），供脚本与视觉核验评估器多视角观察
      if (state.pendingItems) {
        state.preview.setItems(state.pendingItems)
        state.pendingItems = null
      }
      setStatus(`✓ Three.js r${window.THREE ? window.THREE.REVISION : '?'} 已加载，可开始画线`, 'ok')
    } catch (err) {
      setStatus('预览初始化失败：' + err.message, 'err')
    }
  }

  function loadThree() {
    if (cdnIdx >= CDNS.length) {
      setStatus('Three.js CDN 全部加载失败：预览不可用（画线/拟合/导出仍正常）', 'err')
      return
    }
    const s = document.createElement('script')
    s.src = CDNS[cdnIdx++]
    s.onload = bootPreview
    s.onerror = loadThree
    document.head.appendChild(s)
  }

  /* ---------- 五期：window.gms 程序化建模命令层（PRD §2.1，AI 逐步协作建模） ---------- */

  /** 删除笔画（弹层「删除此笔画」与 gms.delete 共用）：不进撤销批次（undo 只管新增）。 */
  function deleteStrokeById(id) {
    const idx = state.strokes.findIndex((s) => s.id === id)
    if (idx < 0) return false
    state.strokes.splice(idx, 1)
    state.fitted.splice(idx, 1)
    state.closed.splice(idx, 1)
    state.lastGenError = null
    ensureSelection()
    renderStrokeList()
    renderDraw()
    scheduleGen()
    saveLocal()
    return true
  }

  /** 解析笔画索引：负数 = 倒数（-1 = 最后一笔）；非法/越界抛中文 Error。 */
  function resolveIndex(i) {
    if (typeof i !== 'number' || !Number.isFinite(i) || !Number.isInteger(i)) {
      throw new Error(`笔画索引非法：应为整数（负数 = 倒数，-1 = 最后一笔），当前值为 ${JSON.stringify(i)}`)
    }
    const idx = i < 0 ? state.strokes.length + i : i
    if (idx < 0 || idx >= state.strokes.length) {
      throw new Error(`笔画索引越界：当前共 ${state.strokes.length} 笔，索引 ${i}（解析为 ${idx}）超出范围`)
    }
    return idx
  }

  function assertFinite(v, name) {
    if (typeof v !== 'number' || !Number.isFinite(v)) {
      throw new Error(`${name}参数非法：应为有限数值，当前值为 ${JSON.stringify(v)}`)
    }
  }

  /** 校验点数组（[x, y] 有限数值对），返回拷贝；非法抛中文 Error。 */
  function validatePoints(pts, what) {
    if (!Array.isArray(pts)) {
      throw new Error(`${what}参数非法：应为 [x, y] 数组，当前值为 ${JSON.stringify(pts)}`)
    }
    return pts.map((p, i) => {
      if (!Array.isArray(p) || p.length < 2 || !Number.isFinite(p[0]) || !Number.isFinite(p[1])) {
        throw new Error(`${what}参数非法：第 ${i + 1} 个点应为 [x, y] 有限数值，当前值为 ${JSON.stringify(p)}`)
      }
      return [p[0], p[1]]
    })
  }

  /** 校验并归一化 opts（render/height/axis/lift/color）；未知字段/非法值抛中文 Error。 */
  function normalizeOpts(opts) {
    if (opts === undefined) return {}
    if (opts === null || typeof opts !== 'object' || Array.isArray(opts)) {
      throw new Error(`opts 参数非法：应为对象 { render, height, axis, lift, color }，当前值为 ${JSON.stringify(opts)}`)
    }
    for (const k of Object.keys(opts)) {
      if (k !== 'render' && k !== 'height' && k !== 'axis' && k !== 'lift' && k !== 'color') {
        throw new Error(`opts 参数非法：未知字段 ${JSON.stringify(k)}（支持 render/height/axis/lift/color），当前值为 ${JSON.stringify(opts)}`)
      }
    }
    const o = {}
    if (opts.render !== undefined) {
      if (opts.render !== 'rod' && opts.render !== 'solid') {
        throw new Error(`render 参数非法：应为 'rod'（杆，缺省）或 'solid'（柱体），当前值为 ${JSON.stringify(opts.render)}`)
      }
      o.render = opts.render
    }
    if (opts.height !== undefined) {
      if (typeof opts.height !== 'number' || !Number.isFinite(opts.height) || opts.height <= 0) {
        throw new Error(`height 参数非法：应为正数（米；solid = 柱体高度，rod = 抬升高度），当前值为 ${JSON.stringify(opts.height)}`)
      }
      o.height = opts.height
    }
    if (opts.lift !== undefined) {
      if (typeof opts.lift !== 'number' || !Number.isFinite(opts.lift) || opts.lift < 0) {
        throw new Error(`lift 参数非法：应为非负有限数值（米；solid = 柱体离地抬升，缺省 0 = 贴地），当前值为 ${JSON.stringify(opts.lift)}`)
      }
      o.lift = opts.lift
    }
    if (opts.axis !== undefined) {
      if (opts.axis !== 'up' && opts.axis !== 'front' && opts.axis !== 'side') {
        throw new Error(`axis 参数非法：应为 'up'（缺省不写）| 'front' | 'side'，当前值为 ${JSON.stringify(opts.axis)}`)
      }
      o.axis = opts.axis
    }
    if (opts.color !== undefined) {
      const c = normalizeColor(opts.color)
      if (!c) throw new Error(`color 参数非法：应为 '#RRGGBB' 或 '0xRRGGBB'，当前值为 ${JSON.stringify(opts.color)}`)
      o.color = c
    }
    return o
  }

  /** 新建笔画 + 套用 opts（先校验，失败不产生笔画）。 */
  function addStrokeWithOpts(points, opts) {
    const o = normalizeOpts(opts)
    if (o.axis !== undefined && o.axis !== 'up' && o.render !== 'solid') {
      throw new Error(`axis 参数仅对 render='solid' 的柱体笔画有效：当前渲染为 ${o.render ? `'${o.render}'` : '缺省（杆）'}，axis=${JSON.stringify(o.axis)}`)
    }
    const stroke = addStroke(points) // 已 push 撤销批次 + 自动选中 + scheduleGen
    state.lastGenError = null
    if (o.render !== undefined) stroke.render = o.render
    if (o.height !== undefined) stroke.height = o.height
    if (o.lift !== undefined) stroke.lift = o.lift
    if (o.axis !== undefined && o.axis !== 'up') stroke.axis = o.axis // 'up' = 缺省不写
    if (o.color !== undefined) stroke.color = o.color
    renderStrokeList()
    renderDraw()
    scheduleGen()
    saveLocal()
    return stroke
  }

  /** 每笔 bbox：px（画布坐标）与米（按当前标定 heightMeters / canvasHeightPx 换算）。 */
  function strokeBBox(points) {
    let minX = Infinity
    let minY = Infinity
    let maxX = -Infinity
    let maxY = -Infinity
    for (const [x, y] of points) {
      if (x < minX) minX = x
      if (y < minY) minY = y
      if (x > maxX) maxX = x
      if (y > maxY) maxY = y
    }
    const pxBox = { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY }
    const k = state.options.heightMeters / (state.options.canvasHeightPx > 0 ? state.options.canvasHeightPx : 1)
    const toM = (v) => Math.round(v * k * 1e6) / 1e6
    return {
      px: pxBox,
      m: { minX: toM(minX), minY: toM(minY), maxX: toM(maxX), maxY: toM(maxY), width: toM(pxBox.width), height: toM(pxBox.height) },
    }
  }

  function gmsSummary() {
    const n = state.strokes.length
    const closedCount = state.closed.filter(Boolean).length
    const itemCount = state.items ? state.items.length : 0
    let status
    let cls = 'ok'
    if (state.lastGenError) {
      status = '生成失败：' + state.lastGenError
      cls = 'err'
    } else if (n === 0) {
      status = '画布已清空：在画布上画线开始'
    } else if (state.fitted.length !== n || state.fitted.some((f) => f === null)) {
      status = `${n} 笔 · ${closedCount} 笔封闭 · ${itemCount} 个元件（生成中…）`
      cls = ''
    } else {
      status = `✓ ${n} 笔 · ${closedCount} 笔封闭 · ${itemCount} 个元件`
    }
    setStatus(status, cls)
    const strokes = state.strokes.map((s, i) => ({
      index: i,
      id: s.id,
      points: s.points.length,
      closed: !!state.closed[i], // 后端封闭检测结果（solid 必须 closed）
      render: s.render !== undefined ? s.render : null, // null = 缺省（杆）
      height: s.height !== undefined ? s.height : null, // null = 缺省（0 抬升）
      axis: s.axis !== undefined ? s.axis : null, // null = 缺省（up）
      color: s.color !== undefined ? s.color : null, // null = 缺省（默认材质）
      bbox: strokeBBox(s.points),
    }))
    return {
      status,
      strokes,
      options: {
        mode: state.options.mode,
        shape: state.options.shape,
        size: state.options.size,
        count: state.options.count,
        heightMeters: state.options.heightMeters,
        canvasHeightPx: state.options.canvasHeightPx,
        calibration: `${state.options.canvasHeightPx}px = ${state.options.heightMeters}m`,
        currentColor: currentColor() || null,
      },
    }
  }

  /** 五期：切换全局生成模式 extrude（拉伸/杆）/ lathe（车削旋转体）。UI 有同款 select，命令版供 AI 协作建模用。 */
  function gmsMode(m) {
    if (m !== 'extrude' && m !== 'lathe') {
      throw new Error(`mode 参数非法：应为 'extrude'（拉伸）或 'lathe'（车削），当前值为 ${JSON.stringify(m)}`)
    }
    state.options.mode = m
    syncControls() // UI select 同步（lathe 时 shape 禁用）
    renderStrokeList()
    renderDraw()
    scheduleGen()
    saveLocal()
    return gmsSummary()
  }

  /** 五期：折线细分笔画（每段 16 细分）——lathe 母线等需要精确直线段的场景用，避免 Catmull-Rom 拐角过冲导致 minX 漂移（轴偏移） */
  function gmsPolyline(pts, opts) {
    validatePoints(pts, '折线')
    if (pts.length < 2) throw new Error('折线至少需要 2 个点')
    const sampled = []
    for (let i = 0; i + 1 < pts.length; i++) {
      const [x0, y0] = pts[i]
      const [x1, y1] = pts[i + 1]
      for (let k = 0; k < 16; k++) {
        sampled.push([x0 + ((x1 - x0) * k) / 16, y0 + ((y1 - y0) * k) / 16])
      }
    }
    sampled.push([pts[pts.length - 1][0], pts[pts.length - 1][1]])
    const s = addStrokeWithOpts(sampled, opts)
    return gmsSummary()
  }

  function gmsClear() {
    if (state.strokes.length > 0) {
      state.strokes = []
      state.fitted = []
      state.closed = []
      state.batches = []
      state.selectedId = null
      state.lastGenError = null
      closePopover()
      renderStrokeList()
      renderDraw()
      scheduleGen()
      saveLocal()
    }
    return gmsSummary()
  }

  function gmsUndo() {
    if (state.strokes.length === 0) return gmsSummary()
    const batch = state.batches.pop() || { len: 1 }
    const len = Math.min(batch.len, state.strokes.length)
    state.strokes.splice(state.strokes.length - len, len)
    state.fitted.splice(state.fitted.length - len, len)
    state.closed.splice(state.closed.length - len, len)
    state.lastGenError = null
    ensureSelection()
    renderStrokeList()
    renderDraw()
    scheduleGen()
    saveLocal()
    return gmsSummary()
  }

  function gmsCircle(cx, cy, r, opts) {
    assertFinite(cx, 'cx（圆心 x，画布像素）')
    assertFinite(cy, 'cy（圆心 y，画布像素）')
    assertFinite(r, 'r（半径，画布像素）')
    if (r <= 0) throw new Error(`r 参数非法：半径应为正数（画布像素），当前值为 ${r}`)
    const points = []
    for (let i = 0; i < 24; i++) { // 24 等距点 + 首尾重合闭合点（与圆工具同构）
      const a = (2 * Math.PI * i) / 24
      points.push([cx + r * Math.cos(a), cy + r * Math.sin(a)])
    }
    points.push([points[0][0], points[0][1]])
    addStrokeWithOpts(points, opts)
    return gmsSummary()
  }

  function gmsRect(x0, y0, x1, y1, opts) {
    assertFinite(x0, 'x0')
    assertFinite(y0, 'y0')
    assertFinite(x1, 'x1')
    assertFinite(y1, 'y1')
    const l = Math.min(x0, x1)
    const t = Math.min(y0, y1)
    const w = Math.abs(x1 - x0)
    const h = Math.abs(y1 - y0)
    if (w === 0 || h === 0) {
      throw new Error(`矩形参数非法：对角两点不能共线（当前宽度 ${w}px、高度 ${h}px）`)
    }
    const points = [[l, t], [l + w, t], [l + w, t + h], [l, t + h], [l, t]] // 4 顶点 + 闭合点（与矩形工具同构）
    addStrokeWithOpts(points, opts)
    return gmsSummary()
  }

  function gmsLine(x0, y0, x1, y1, opts) {
    assertFinite(x0, 'x0')
    assertFinite(y0, 'y0')
    assertFinite(x1, 'x1')
    assertFinite(y1, 'y1')
    if (x0 === x1 && y0 === y1) {
      throw new Error(`直线参数非法：两点重合（当前均为 (${x0}, ${y0})），零长度直线无意义`)
    }
    addStrokeWithOpts([[x0, y0], [x1, y1]], opts)
    return gmsSummary()
  }

  function gmsCurve(pts, closed, opts) {
    if (closed !== undefined && typeof closed !== 'boolean') {
      throw new Error(`closed 参数非法：应为布尔值（缺省 false = 开放曲线），当前值为 ${JSON.stringify(closed)}`)
    }
    const controls = validatePoints(pts, 'curve 控制点')
    if (controls.length < 2) throw new Error(`curve 参数非法：控制点至少 2 个，当前为 ${controls.length} 个`)
    const sampled = sampleCatmullRom(controls, !!closed)
    addStrokeWithOpts(sampled, opts)
    return gmsSummary()
  }

  function gmsLoop(pts, opts) {
    const points = validatePoints(pts, 'loop 轮廓')
    if (points.length < 3) throw new Error(`loop 参数非法：轮廓点至少 3 个，当前为 ${points.length} 个`)
    if (!autoClose(points)) {
      throw new Error(`loop 参数非法：首尾距离超过包围盒对角线 20%，无法闭合；请让首尾点靠近或重合（首尾重合最稳）`)
    }
    addStrokeWithOpts(points, opts)
    return gmsSummary()
  }

  function gmsProps(i, opts) {
    const idx = resolveIndex(i)
    const o = normalizeOpts(opts)
    const stroke = state.strokes[idx]
    const effRender = o.render !== undefined ? o.render : (stroke.render !== undefined ? stroke.render : null)
    if (o.axis !== undefined && o.axis !== 'up' && effRender !== 'solid') {
      throw new Error(`axis 参数仅对 render='solid' 的柱体笔画有效：笔画 ${i} 当前渲染为 ${effRender === null ? '缺省（杆）' : `'${effRender}'`}，axis=${JSON.stringify(o.axis)}`)
    }
    if (o.render !== undefined) {
      stroke.render = o.render
      if (o.render !== 'solid' && stroke.axis) delete stroke.axis // axis 仅柱体有效（与弹层一致）
    }
    if (o.height !== undefined) stroke.height = o.height
    if (o.lift !== undefined) stroke.lift = o.lift
    if (o.axis !== undefined) {
      if (o.axis === 'up') delete stroke.axis // 'up' = 缺省不写
      else stroke.axis = o.axis
    }
    if (o.color !== undefined) stroke.color = o.color
    state.lastGenError = null
    renderStrokeList()
    renderDraw()
    scheduleGen()
    saveLocal()
    return gmsSummary()
  }

  function gmsRotate(i, cx, cy, n) {
    const idx = resolveIndex(i)
    assertFinite(cx, 'cx（旋转中心 x，画布像素）')
    assertFinite(cy, 'cy（旋转中心 y，画布像素）')
    if (typeof n !== 'number' || !Number.isFinite(n) || !Number.isInteger(n) || n < 2 || n > 12) {
      throw new Error(`n 参数非法：份数应为 2~12 的整数，当前值为 ${JSON.stringify(n)}`)
    }
    const src = state.strokes[idx]
    const copies = makeRotationCopies(src, [cx, cy], n)
    const pos = state.strokes.indexOf(src)
    state.strokes.splice(pos + 1, 0, ...copies) // 副本插入源笔画之后（与 confirmRotate 同构）
    state.fitted.splice(pos + 1, 0, ...copies.map(() => null))
    state.closed.splice(pos + 1, 0, ...copies.map(() => false))
    state.batches.push({ len: copies.length }) // 一个撤销批次：一次撤销整体取消
    state.selectedId = src.id
    state.lastGenError = null
    renderStrokeList()
    renderDraw()
    scheduleGen()
    saveLocal()
    return gmsSummary()
  }

  function gmsDelete(i) {
    const idx = resolveIndex(i)
    const id = state.strokes[idx].id
    if (el('colorPopover').dataset.strokeId === id) closePopover() // 删除弹层目标笔画时关弹层
    deleteStrokeById(id)
    return gmsSummary()
  }

  function gmsPx2m(px) {
    assertFinite(px, 'px')
    const c = state.options.canvasHeightPx > 0 ? state.options.canvasHeightPx : 1
    return (px * state.options.heightMeters) / c
  }

  function gmsM2px(m) {
    assertFinite(m, 'm')
    const c = state.options.canvasHeightPx > 0 ? state.options.canvasHeightPx : 1
    return (m * c) / state.options.heightMeters
  }

  function gmsExport() {
    // 返回作品 JSON（{ version, strokes, options }，与「导出作品 JSON」按钮同构；可直传 gms.import）
    return { version: WORK_VERSION, strokes: state.strokes, options: state.options }
  }

  function gmsImport(data) {
    let parsed = data
    if (typeof data === 'string') {
      try {
        parsed = JSON.parse(data)
      } catch (e) {
        throw new Error(`import 参数非法：JSON 解析失败（${e.message}）`)
      }
    }
    if (!applyWork(parsed)) {
      throw new Error(`import 参数非法：不是有效的作品 JSON（需为 { version: 3, strokes, options } 对象或 JSON 字符串），当前类型为 ${typeof data}`)
    }
    state.lastGenError = null
    saveLocal()
    return gmsSummary()
  }

  window.gms = {
    clear: gmsClear,
    undo: gmsUndo,
    circle: gmsCircle,
    rect: gmsRect,
    line: gmsLine,
    curve: gmsCurve,
    polyline: gmsPolyline,
    loop: gmsLoop,
    props: gmsProps,
    rotate: gmsRotate,
    delete: gmsDelete,
    summary: gmsSummary,
    px2m: gmsPx2m,
    m2px: gmsM2px,
    export: gmsExport,
    import: gmsImport,
    mode: gmsMode,
  }

  /* ---------- 启动 ---------- */

  resizeDraw()
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resizeDraw).observe(drawCanvas)
  }
  window.addEventListener('resize', resizeDraw)

  syncControls()
  renderMainPalette()
  renderStrokeList()
  if (!restoreLocal()) setStatus('在画布上画线（鼠标或手指），松手自动拟合生成；画完点击笔画圆点可改颜色/渲染/高度/方向')
  updateToolbar()
  loadThree()

  window.addEventListener('pagehide', () => {
    if (state.preview) { try { state.preview.dispose() } catch (e) { /* 忽略 */ } }
  })
})()
</script>
</body>
</html>
