<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MacBook 影棚渲染 · 页面通道</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  #hud { position: fixed; left: 10px; top: 10px; color: #9fb; font: 12px/1.5 ui-monospace, monospace;
         background: rgba(0,0,0,.45); padding: 6px 9px; border-radius: 6px; pointer-events: none; }
  #ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 6px; align-items: center;
        font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: #e8e8ea;
        user-select: none; }
  #ui .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
             background: rgba(20,20,22,.74); padding: 6px 8px; border-radius: 10px;
             box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #ui button { font: inherit; color: #dcdce0; background: rgba(255,255,255,.08);
               border: 1px solid rgba(255,255,255,.14); border-radius: 7px;
               padding: 5px 11px; cursor: pointer; }
  #ui button:hover { background: rgba(255,255,255,.20); color: #fff; }
  #ui button.on { background: #e8e8ea; color: #17171a; border-color: #e8e8ea; font-weight: 600; }
  #ui .hint { color: #9a9aa0; font-size: 11px; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: #0a0a0c; color: #cfcfd4; z-index: 9; transition: opacity .25s;
          font: 14px/1.7 -apple-system, "Segoe UI", system-ui, sans-serif; }
  #load.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">loading…</div>
<div id="load">正在加载模型…</div>
<div id="ui">
  <div class="row" id="rowView"></div>
  <div class="row" id="rowPreset"></div>
  <div class="row">
    <button id="btnLid">开 / 合盖</button>
    <button id="btnReset">重置视角</button>
    <button id="btnQ">画质：高</button>
    <button id="btnSave">保存 PNG</button>
    <button id="btnHud">隐藏文字</button>
  </div>
  <div class="hint">拖动旋转 · 滚轮缩放 · Shift / 右键拖动平移 · L 开合盖</div>
</div>
<script>
/**
 * photo.html —— 页面通道的「影棚渲染」模式
 *
 * 为什么单独开一页：既有 preview-demo.html 是"编辑器视口"（深蓝底 + 网格 + 环境光 0.65 +
 * 两盏平行光，无环境贴图、无色调映射），它的输出天生是 CAD 视口而不是照片，
 * 拿它做"以假乱真"盲测没有意义。本页用同一份网格数据（web/draw/macbook-current.json）
 * 走真正的产品级渲染：PBR 材质 + 程序化影棚环境贴图（PMREM）+ ACES 色调映射 +
 * 2× 超采样 + 无网格/无坐标轴。
 *
 * 对外 API（供 CDP 驱动）：
 *   window.__photo.ready            → true 表示网格与环境就绪
 *   window.__photo.shoot(view)      → 设置相机 + 渲染，返回 {view, w, h}
 *   window.__photo.setBg('#000')    → 背景色
 *   window.__photo.views            → 可用视角名列表
 */
(function () {
  'use strict'
  // 本地优先：three r160 直接从工作区出（node_modules/three/build/three.min.js 复制到
  // web/draw/three.min.js）——CDN 首包在国内常被墙/超时，是"页面加载很久"的头号嫌疑。
  // 后面两个 CDN 只作兜底（版本一致 0.160.0）。
  var CDNS = [
    './three.min.js',
    'https://unpkg.com/three@0.160.0/build/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
  ]
  var hud = document.getElementById('hud')
  var canvas = document.getElementById('canvas')
  // ---------- 性能探针 ----------
  // 用户反馈「加载很久」——先量化再优化，别猜。__perf 记录各阶段耗时（ms，相对脚本启动）。
  var T0 = performance.now()
  var PERF = { t_three: 0, t_mesh_fetched: 0, t_mesh_built: 0, t_env: 0, t_first_render: 0,
               render_ms: 0, renders: 0, mesh_bytes: 0, live_ms: 0 }
  window.__perf = PERF
  function mark(k) { PERF[k] = Math.round(performance.now() - T0) }

  // ---------- 视角表（与盲测参考图同角度类别）----------
  // azim: 绕 y 轴方位角（0 = 从正前方看），elev: 仰角，dist: 相机距离（米），target: 注视点
  var VIEWS = {
    front:    { azim: 0,   elev: 3,  dist: 0.40, fov: 30, target: [0, 0.092, 0.005] },
    hero:     { azim: 34,  elev: 24, dist: 0.70, fov: 30, target: [0, 0.085, 0.000] },
    top:      { azim: 0,   elev: 80, dist: 0.56, fov: 32, target: [0, 0.040, 0.000] },
    kb:       { azim: 0,   elev: 86, dist: 0.43, fov: 30, target: [0, 0.012, 0.0015] },
    // 端口特写：配对 official-mbp14-ports-1.jpg（左壁 MagSafe+2×USB-C+jack，z 36.7..82.5）。
    // 旧机位 target z=0.020 只框住 C2+jack；端口 z 实测后整簇中心在 z=62。
    ports:    { azim: 270, elev: 3,  dist: 0.26, fov: 24, target: [0, 0.008, -0.060] },
    // 官方侧视图是长焦/近正交（机身 312mm 在画幅里几乎不变形）；0.26m+fov24 透视太强，
    // 墙面被压缩、上盖顶面被放大 → 与官方图无法逐项对照。长焦版：2.1m + fov 8.5° ≈ 正交。
    portstele:{ azim: 270, elev: 0.0, dist: 3.00, fov: 1.6, target: [0, 0.008, 0.0] },
    sidetele: { azim: 90,  elev: 0.0, dist: 3.00, fov: 1.6, target: [0, 0.008, 0.0] },
    // 右壁全景：HDMI(82.7)+USB-C(64.4)+SDXC(39.8)，旧机位把 HDMI 切在画框外。
    side:     { azim: 90,  elev: 3,  dist: 0.40, fov: 24, target: [0, 0.008, -0.060] },
    screen34: { azim: 20,  elev: 9,  dist: 0.60, fov: 30, target: [0, 0.120, -0.010] },
    lid:      { azim: 10,  elev: 5,  dist: 0.56, fov: 30, target: [0, 0.140, -0.030] },
    // 屏幕特写（配对 `/mnt/e/模型/笔记本/正视图.png`：该参考是屏幕占满画幅的正面近景）
    screenfront: { azim: 0, elev: 5, dist: 0.44, fov: 30, target: [0, 0.105, -0.075] },
    // 闭合上盖俯视（配对 `/mnt/e/模型/笔记本/俯视图.png`）：参考图机身几乎填满画幅（~96% 宽）
    closedtop:{ azim: 0,   elev: 89, dist: 0.550, fov: 30, target: [0, 0.008, 0.000] },  // 0.385 时 312.6mm 宽被画框裁掉两侧
    // 底盖俯视（配对 `底盖和100°侧面姿态.png` 的底盖部分）
    bottom:   { azim: 0,   elev: -88, dist: 0.50, fov: 30, target: [0, 0.000, 0.000], noRefl: true },  // 0.40 时底面被裁
    // 转轴特写（左后方低角度）：看槽内筒、端面、盖缝。用户 2026-09-10 点名的位置。
    hinge:    { azim: 212, elev: 16, dist: 0.34, fov: 30, target: [-0.010, 0.013, -0.095] },
    hingel:   { azim: 262, elev: 9,  dist: 0.30, fov: 28, target: [-0.090, 0.011, -0.090] },
    // 屏幕边框/活动区边缘特写（用户 2026-09-10 圈的那处：掠射角下的台阶）
    bezel:    { azim: -22, elev: -9, dist: 0.30, fov: 32, target: [-0.100, 0.055, -0.060] },
    bezel2:   { azim: -42, elev: -26, dist: 0.17, fov: 30, target: [-0.135, 0.035, -0.080] },
    // 上盖前角特写（用户 2026-09-10：这两个角在反光场景下像透明能看到里面）
    cornerL:  { azim: 208, elev: 24, dist: 0.16, fov: 30, target: [-0.150, 0.212, -0.136] },
    cornerR:  { azim: 152, elev: 24, dist: 0.16, fov: 30, target: [0.150, 0.212, -0.136] },
    // 台面前角（掌托左侧，用户最后圈的那处：反光时像透明能看到里面）
    deckL:    { azim: -46, elev: 42, dist: 0.26, fov: 32, target: [-0.140, 0.010, 0.098] },
    deckR:    { azim: 46,  elev: 42, dist: 0.26, fov: 32, target: [0.140, 0.010, 0.098] },
    // 合盖侧缝（用户 2026-09-10：侧面看闭合线对不上）
    leftseam: { azim: 254, elev: 26, dist: 0.30, fov: 32, target: [-0.132, 0.014, 0.010] },
    // 前缘开盖凹槽特写（用户：「正前方凹槽的细节需要打磨」）
    groove:   { azim: 0,   elev: 6,  dist: 0.17, fov: 26, target: [0, 0.010, 0.108] },
    groove34: { azim: 34,  elev: 14, dist: 0.20, fov: 30, target: [0.02, 0.011, 0.104] },
    // 接口特写（左壁）：MagSafe / 2×USB-C / 耳机孔
    portclose:{ azim: 268, elev: 4,  dist: 0.15, fov: 26, target: [-0.150, 0.008, -0.052] },
  }

  function boot(THREE) {
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true })
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 0.95
    renderer.shadowMap.enabled = false

    var scene = new THREE.Scene()
    window.__scene = scene
    scene.background = new THREE.Color(0x000000)

    var camera = new THREE.PerspectiveCamera(30, 1.6, 0.01, 100)

    // ---------- 影棚预设 ----------
    // 用户补的参考图里绝大多数是**白底产品照**（俯视图/正视图/键盘和触控板/底盖…），
    // 而此前我的六张全是黑底虚空 → 裁判一眼分genre。预设把「背景/地面/环境/阴影/反射」
    // 打包成一套，按参考图的体裁出图。
    var PRESETS = {
      // 黑底影棚（官方 hero/m3-official 那一类）
      dark: {
        bg: 0x000000, bgGrad: null, ground: 0x0b0b0d, groundRough: 0.55, groundMetal: 0.0,
        groundOpacity: 0.52,          // 玻璃台面：倒影（y<0 的镜像组）才穿得出来
        shadow: 0.62, refl: 0.30, exposure: 0.95,
        env: { room: 0x0a0a0c, key: 4.2, keyW: 2.4, keyH: 0.9, sideW: 1.9, sideH: 0.42, sideL: 1.35, sideR: 1.0, back: 1.5, floor: 1.45, floorCol: 0x8a8f96 },
      },
      // 白底产品照（参考图主体裁：无缝白背景 + 柔和接触阴影 + 极淡倒影）
      white: {
        bg: 0xffffff, bgGrad: [0xffffff, 0xfafbfc], bgComp: true, ground: 0xf6f7f8, groundRough: 0.46, groundMetal: 0.0,
        shadow: 0.30, refl: 0.15, exposure: 0.55,
        // 标定（对参考图 俯视图.png 实测 lid mean 213 / logo +13 / bg 255）：
        // 强度已含 0.30 全局倍率，exposure 0.55——envScale 保持 1 即得标定态
        env: { room: 0xb0b0b0, key: 1.30, keyW: 3.6, keyH: 1.8, sideL: 0.38, sideR: 0.32, back: 0.50, floor: 0.90, floorCol: 0xffffff },
      },
      // 中性灰（桌面场景/带环境反射的那类参考图）
      grey: {
        bg: 0x9aa0a6, bgGrad: [0xb9bfc5, 0x7d8288], ground: 0x8e9399, groundRough: 0.42, groundMetal: 0.0,
        groundOpacity: 0.80, shadow: 0.44, refl: 0.16, exposure: 0.93,
        env: { room: 0x24262a, key: 5.0, keyW: 2.6, keyH: 1.0, sideL: 1.25, sideR: 1.0, back: 1.8, floor: 0.8, floorCol: 0xd8dce0 },
      },
    }
    var curPreset = 'dark'
    // 环境强度全局倍率：铝面亮度校准用（参考图 俯视图 闭合上盖实测 mean 214 / p5 202 / p95 242）
    var ENV_SCALE = 1
    // 只缩放**强度**字段——早期版本对整个 env 对象做乘法，把颜色也乘了：
    // 0xcfcfcf × 0.46 = 0x5fabfe（蓝）→ 上盖顶部蓝色渐变、logo 镜面变暗。
    var ENV_INT = ['key', 'sideL', 'sideR', 'back', 'floor']
    function scaleEnv(e, k) {
      var o = {}
      for (var kk in e) o[kk] = (ENV_INT.indexOf(kk) >= 0) ? e[kk] * k : e[kk]
      return o
    }

    // ---------- 程序化影棚环境（软箱 + 侧板 + 地面反弹）----------
    // 用 CubeCamera 把一个"发光房间"烘进 cubemap，再 PMREM 成 IBL。
    // 这样金属表面才有连续的高光带（这是照片与 CAD 视口最大的差别）。
    var envScene = new THREE.Scene()
    var pmrem = new THREE.PMREMGenerator(renderer)
    pmrem.compileCubemapShader()
    var envRT = null
    function bakeEnv(e) {
      while (envScene.children.length) envScene.remove(envScene.children[0])
      function panel(w, h, x, y, z, rx, ry, color, intensity) {
        var m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide })
        )
        m.material.color.multiplyScalar(intensity)
        m.position.set(x, y, z)
        m.rotation.set(rx, ry, 0)
        envScene.add(m)
      }
      envScene.add(new THREE.Mesh(
        new THREE.BoxGeometry(6, 4, 6),
        new THREE.MeshBasicMaterial({ color: e.room, side: THREE.BackSide })
      ))
      panel(e.keyW, e.keyH, 0, 1.9, 0.25, Math.PI / 2, 0, 0xffffff, e.key)        // 主软箱（正上方偏前）
      panel(e.sideW || 1.6, e.sideH || 1.4, -1.7, 0.55, 0.1, 0, Math.PI / 2, 0xf2f2f2, e.sideL)   // 左侧柔光板
      panel(e.sideW || 1.6, e.sideH || 1.4, 1.7, 0.55, 0.1, 0, -Math.PI / 2, 0xf2f2f2, e.sideR)   // 右侧柔光板
      panel(2.0, 0.5, 0, 0.8, -1.9, 0, 0, 0xffffff, e.back)                      // 后方条形光
      panel(6, 6, 0, -1.6, 0, -Math.PI / 2, 0, e.floorCol, e.floor)              // 地面反弹
      var cubeRT = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType })
      var cubeCam = new THREE.CubeCamera(0.1, 30, cubeRT)
      cubeCam.position.set(0, 0.4, 0)
      envScene.add(cubeCam)
      cubeCam.update(renderer, envScene)
      if (envRT) envRT.dispose()
      envRT = pmrem.fromCubemap(cubeRT.texture)
      scene.environment = envRT.texture
      cubeRT.dispose()
      mark('t_env')
    }
    bakeEnv(PRESETS.dark.env)

    // 关键光（给一个明确的镜面高光点 + 轻微方向感）
    var key = new THREE.DirectionalLight(0xffffff, 1.5)
    key.position.set(-1.1, 2.2, 1.4)
    scene.add(key)
    var kbFill = new THREE.DirectionalLight(0xffffff, 0.85)   // 键盘补光（让键帽字标可读）
    kbFill.position.set(0.15, 1.6, 0.9)
    scene.add(kbFill)
    var rim = new THREE.DirectionalLight(0xececec, 0.45)
    rim.position.set(1.4, 0.6, -1.8)
    scene.add(rim)

    // ---------- 材质表（按颜色分组建 PBR 材质）----------
    function hexOf(c) { return typeof c === 'string' ? parseInt(c.replace('0x', ''), 16) : c }
    function isLight(hex) { return ((hex >> 16) & 255) + ((hex >> 8) & 255) + (hex & 255) > 300 }
    function makeMat(hex) {
      var light = isLight(hex)
      var col = new THREE.Color(hex)
      // 触控板：浅色**磨砂玻璃**（参考图 trackpad/deck 亮度比 0.985、p5 215 p95 229 近乎平场）。
      // 深色镜面玻璃在垂直视角只有 4% 反射率 → 实测读 93（过暗 2.4×），物理上不可能到 222。
      // ⚠ 必须排在 isLight 之前：0x909093 三通道和 435 > 阈值 300，否则被当成"浅色铝"。
      if (hex === 0x909093) {
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(0xe6e6e8), metalness: 0.0, roughness: 0.10, side: THREE.DoubleSide,
          envMapIntensity: 1.1, clearcoat: 0.6, clearcoatRoughness: 0.06,
        })
      }
      // Apple 标：镜面 PVD 嵌件（metal 1 / rough 0.04）。参考图 俯视图 里 logo 比上盖**更亮**
      // （反射影棚主光），若按普通铝面（rough 0.30）渲染则读作灰苹果 + 暗边。
      if (hex === 0xfbfbfc) {
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(0xffffff), metalness: 0.90, roughness: 0.26, side: THREE.DoubleSide, envMapIntensity: 2.10,
        })
      }
      // 浅色 = 阳极氧化铝（金属 + 中等粗糙度 + 轻微清漆层）；深色 = 屏幕/键帽/端口内腔
      if (light) {
        return new THREE.MeshPhysicalMaterial({
          color: col, metalness: 0.92, roughness: 0.30, side: THREE.DoubleSide,
          clearcoat: 0.25, clearcoatRoughness: 0.35, envMapIntensity: 1.0,
        })
      }
      // 极深色（#0d101d 屏幕活动区）：给一点自发光，读作"亮着的屏"
      if (hex === 0x191919) {   // 屏幕活动区（键帽 0x1d1d1f 曾因阈值 90 误入此分支 → 键盘发蓝）
        return new THREE.MeshPhysicalMaterial({
          color: col, metalness: 0.05, roughness: 0.45, envMapIntensity: 0.7, side: THREE.DoubleSide,
          emissive: new THREE.Color(0x16264a), emissiveIntensity: 0.5,
          // 玻璃盖板：真机屏幕在影棚里必然映出柔光箱（眩光）。旧版纯 emissive = 贴纸感。
          clearcoat: 0.85, clearcoatRoughness: 0.08,
        })
      }
      // 键帽 PBT 微磨砂：参考图 键盘和触控板.png 键帽顶面 36–48（p5 21 / p95 49 有光泽梯度），
      // 旧值 roughness 0.55 / env 0.65 读作 27 过黑 → 加深层清漆把表面光泽补回来。
      if (hex === 0x1d1d1f) {
        return new THREE.MeshPhysicalMaterial({
          // r12：碟面高光在掠射角成一条细白线（用户 2026-09-10「键盘异常的白线」）——
          // 真机键帽是 PBT 微磨砂（规格图：表面微磨砂），不该有镜面亮线 → 粗糙度抬高、清漆压到近乎无
          color: col, metalness: 0.06, roughness: 0.80, side: THREE.DoubleSide,
          clearcoat: 0.04, clearcoatRoughness: 0.85, envMapIntensity: 0.95,
        })
      }
      // 屏幕玻璃边框 0x151516：深色、弱反射（真机黑边近乎纯黑）
      if (hex === 0x151516) {
        return new THREE.MeshPhysicalMaterial({
          color: col, metalness: 0.30, roughness: 0.11, side: THREE.DoubleSide, envMapIntensity: 0.55,
          clearcoat: 0.6, clearcoatRoughness: 0.10,
        })
      }
      return new THREE.MeshPhysicalMaterial({ color: col, metalness: 0.06, roughness: 0.55, envMapIntensity: 0.65, side: THREE.DoubleSide })
    }

    var root = new THREE.Group()
    scene.add(root)
    var meshReady = false
    var screenTex = null
    var texLoader = new THREE.TextureLoader()
    texLoader.load('./screen-ui.png', function (t) {
      t.colorSpace = THREE.SRGBColorSpace
      t.anisotropy = 8
      screenTex = t
      // 纹理可能在网格之后才到 → 补挂到已建好的屏幕材质上
      if (window.__screenMat) {
        window.__screenMat.map = t
        window.__screenMat.emissiveMap = t
        window.__screenMat.emissive = new THREE.Color(0xffffff)
        window.__screenMat.emissiveIntensity = SCREEN_BASE
        lidScreen(lidDeg)          // 贴图晚到：重新按当前开合角决定亮灭（合盖必须熄屏）
        window.__screenMat.needsUpdate = true
      }
      hud.textContent = hud.textContent + ' · screen tex ok'
    })

    function buildMesh(data) {
      // 按颜色分组 → 每组一个 mesh（PBR 材质按组给，避免整机一个材质）
      var groups = new Map()
      var F = data.faces, C = data.colors
      for (var t = 0; t < F.length / 3; t++) {
        var c = C[t]
        if (!groups.has(c)) groups.set(c, [])
        groups.get(c).push(F[t * 3], F[t * 3 + 1], F[t * 3 + 2])
      }
      var V = data.vertices
      var NR = data.normals || null
      function nrmArray() {
        if (!NR) return null
        var a = new Float32Array(NR.length * 3)
        for (var i = 0; i < NR.length; i++) { a[i * 3] = NR[i][0]; a[i * 3 + 1] = NR[i][1]; a[i * 3 + 2] = NR[i][2] }
        return a
      }
      // 有解析法线就用它（硬边不糊、端口条纹消失），否则回退面法线平均
      function setN(g) {
        var a = nrmArray()
        if (a) g.setAttribute('normal', new THREE.BufferAttribute(a, 3))
        else g.computeVertexNormals()
      }
      function posArray() {
        var pos = new Float32Array(V.length * 3)
        for (var i = 0; i < V.length; i++) { pos[i * 3] = V[i][0]; pos[i * 3 + 1] = V[i][1]; pos[i * 3 + 2] = V[i][2] }
        return pos
      }
      groups.forEach(function (idx, colHex) {
        var pos = posArray()
        // 键帽组：顶面(ny>0.55)贴字标图，侧面保持纯色（字标是蚀刻在键帽顶面的）
        // hexOf 归一：mesh JSON 的 colors 可能是 '0x1d1d1f' 也可能是整数 1907998
        if (hexOf(colHex) === 0x1d1d1f) {
          var topIdx = [], sideIdx = []
          for (var t = 0; t < idx.length; t += 3) {
            var A = V[idx[t]], B = V[idx[t + 1]], C = V[idx[t + 2]]
            var ux = B[0] - A[0], uy = B[1] - A[1], uz = B[2] - A[2]
            var vx = C[0] - A[0], vy = C[1] - A[1], vz = C[2] - A[2]
            var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx
            var L = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1
            if (Math.abs(ny / L) > 0.55) { topIdx.push(idx[t], idx[t + 1], idx[t + 2]) }   // 网格绕序不统一，取 |ny|
            else { sideIdx.push(idx[t], idx[t + 1], idx[t + 2]) }
          }
          var gSide = new THREE.BufferGeometry()
          gSide.setAttribute('position', new THREE.BufferAttribute(pos.slice(), 3))
          gSide.setIndex(sideIdx); setN(gSide)
          // 键帽**侧面**单独用近黑哑光材质：俯视时行间看到的是相邻键帽侧壁的一条掠射窄条，
          // 旧版沿用键帽面材质（envMapIntensity 0.95）→ 那条窄条被环境照亮成"异常白线"
          // （用户 2026-09-10 圈出、r12 误判为碟面高光）。真机 PBT 侧壁在缝隙里是近黑的。
          var matCapSide = new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(0x0e0e0f), metalness: 0.02, roughness: 0.95,
            envMapIntensity: 0.22, side: THREE.DoubleSide,
          })
          root.add(new THREE.Mesh(gSide, matCapSide))
          var gTop = new THREE.BufferGeometry()
          gTop.setAttribute('position', new THREE.BufferAttribute(pos.slice(), 3))
          gTop.setIndex(topIdx)
          // 平面 UV：世界 (x,z) → 键盘字标图坐标（图覆盖 x∈[-139.65,139.65]、z∈[-98.6,11.65]）
          var KBX0 = -0.13965, KBW = 0.2793, KBZ0 = -0.0986, KBD = 0.11025   // 米（顶点坐标单位）
          var uvT = new Float32Array(V.length * 2)
          for (var vi2 = 0; vi2 < V.length; vi2++) {
            uvT[vi2 * 2] = (V[vi2][0] - KBX0) / KBW
            uvT[vi2 * 2 + 1] = 1 - (V[vi2][2] - KBZ0) / KBD
          }
          gTop.setAttribute('uv', new THREE.BufferAttribute(uvT, 2))
          setN(gTop)
          var matTop = makeMat(0x1d1d1f)
          var tl = new THREE.TextureLoader()
          tl.load('./kb-legends.png', function (tx) {
            tx.colorSpace = THREE.SRGBColorSpace
            tx.anisotropy = 8
            matTop.map = tx
            matTop.color.set(0xffffff)     // map 自带键帽底色，乘 base color 会变全黑
            matTop.needsUpdate = true
          })
          root.add(new THREE.Mesh(gTop, matTop))
          window.__kbDebug = { top: topIdx.length / 3, side: sideIdx.length / 3 }
          return
        }
        var g = new THREE.BufferGeometry()
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3))
        g.setIndex(idx)
        setN(g)
        var mat = makeMat(hexOf(colHex))
        // 屏幕活动区：**平面内** UV。不能用世界 bbox——上盖开 100° 时屏幕平面相对
        // 世界 z 压缩 cos(80°)=0.174，按 bbox 归一化会把桌面贴图竖向拉伸 5.76×：
        // 评委据此指出「刘海渲染成悬垂进屏内的大黑梯形」（实测渲染 141px 高 vs 应 25px）。
        if (hexOf(colHex) === 0x191919) {
          var bb = new THREE.Box3().setFromBufferAttribute(g.getAttribute('position'))
          // 平面法线：取一个面积最大的三角形
          var nrm = new THREE.Vector3(0, 1, 0), best = -1
          for (var ti = 0; ti < idx.length; ti += 3) {
            var A = V[idx[ti]], B = V[idx[ti + 1]], C = V[idx[ti + 2]]
            var ux = B[0] - A[0], uy = B[1] - A[1], uz = B[2] - A[2]
            var wx = C[0] - A[0], wy = C[1] - A[1], wz = C[2] - A[2]
            var nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx
            var L2 = nx * nx + ny * ny + nz * nz
            if (L2 > best) { best = L2; nrm.set(nx, ny, nz).normalize() }
          }
          // u = 世界 +x 投影到屏幕平面（上盖绕 x 轴旋转，x 分量不变 → 屏幕水平方向）
          var uAx = new THREE.Vector3(1, 0, 0).projectOnPlane(nrm).normalize()
          var vAx = new THREE.Vector3().crossVectors(nrm, uAx).normalize()
          var ctr = new THREE.Vector3((bb.min.x + bb.max.x) / 2, (bb.min.y + bb.max.y) / 2, (bb.min.z + bb.max.z) / 2)
          var uMin = 1e9, uMax = -1e9, vMin = 1e9, vMax = -1e9, tmpv = new THREE.Vector3()
          for (var ti2 = 0; ti2 < idx.length; ti2++) {
            var iv = idx[ti2]
            tmpv.set(V[iv][0] - ctr.x, V[iv][1] - ctr.y, V[iv][2] - ctr.z)
            var du = tmpv.dot(uAx), dv = tmpv.dot(vAx)
            if (du < uMin) uMin = du; if (du > uMax) uMax = du
            if (dv < vMin) vMin = dv; if (dv > vMax) vMax = dv
          }
          var uSpan = (uMax - uMin) || 1, vSpan = (vMax - vMin) || 1
          var uv = new Float32Array(V.length * 2)
          for (var vi3 = 0; vi3 < V.length; vi3++) {
            tmpv.set(V[vi3][0] - ctr.x, V[vi3][1] - ctr.y, V[vi3][2] - ctr.z)
            uv[vi3 * 2] = (tmpv.dot(uAx) - uMin) / uSpan
            uv[vi3 * 2 + 1] = 1 - (tmpv.dot(vAx) - vMin) / vSpan
          }
          window.__screenUV = { uSpan: uSpan, vSpan: vSpan, normal: [nrm.x, nrm.y, nrm.z] }
          g.setAttribute('uv', new THREE.BufferAttribute(uv, 2))
          window.__screenMat = mat
          if (screenTex) { mat.map = screenTex; mat.emissiveMap = screenTex; mat.emissive = new THREE.Color(0xffffff); mat.emissiveIntensity = SCREEN_BASE; mat.needsUpdate = true }
        }
        var mesh = new THREE.Mesh(g, mat)
        mesh.frustumCulled = false
        root.add(mesh)
      })
      meshReady = true
      // 自动取景：包围盒中心 + 对角线定基准距离
      var box = new THREE.Box3().setFromObject(root)
      var c = box.getCenter(new THREE.Vector3())
      var sz = box.getSize(new THREE.Vector3())
      var diag = sz.length()
      // 视角表用绝对坐标（模型尺寸固定）；bbox 仅记录到 HUD 供核对
      hud.textContent = 'photo mode ready ' + BUILD + ' · ' + groups.size + ' materials · ' +
        (F.length / 3) + ' tris · bbox ' + sz.x.toFixed(2) + '×' + sz.y.toFixed(2) + '×' + sz.z.toFixed(2)
      // ---------- 上盖拆分：上盖是刚体，页面绕转轴旋转即可开盖/合盖 ----------
      // mesh JSON 的 lid = {from,to,hingeY,hingeZ,angle}（page-mesh.mjs 用「同参数再建一次 0° 姿态、
      // 逐顶点比对」标出来，并按部件隔离焊接，保证区间连续、无跨部件三角）。
      // 局部坐标 = R(-A)·(p - hinge)，挂在 hinge 处的一个 Group 上；开合只改 group.rotation.x
      // （与 geometry.ts 的 xf 同式：R(φ): y'=y cosφ + z sinφ, z'=-y sinφ + z cosφ → THREE 用 -φ）。
      var lidGroup = null, lidAngle0 = 0
      if (data.lid && data.lid.to > data.lid.from) {
        var LID = data.lid
        lidAngle0 = LID.angle || 0
        lidGroup = new THREE.Group()
        lidGroup.position.set(0, LID.hingeY, LID.hingeZ)
        var ra = lidAngle0 * Math.PI / 180, ca = Math.cos(ra), sa = Math.sin(ra)
        var kids = root.children.slice()
        kids.forEach(function (m) {
          var g = m.geometry, pa = g.getAttribute('position'), ix = g.getIndex()
          if (!pa || !ix) return
          var src = ix.array, body = [], lid = []
          for (var t = 0; t < src.length; t += 3) {
            var a = src[t], b = src[t + 1], c = src[t + 2]
            if (a >= LID.from && a < LID.to && b >= LID.from && b < LID.to && c >= LID.from && c < LID.to) lid.push(a, b, c)
            else body.push(a, b, c)
          }
          if (!lid.length) return
          g.setIndex(body)
          var lp = pa.array.slice()
          for (var i = LID.from; i < LID.to; i++) {
            var py = lp[i * 3 + 1] - LID.hingeY, pz = lp[i * 3 + 2] - LID.hingeZ
            lp[i * 3 + 1] = py * ca - pz * sa
            lp[i * 3 + 2] = py * sa + pz * ca
          }
          var lg = new THREE.BufferGeometry()
          lg.setAttribute('position', new THREE.BufferAttribute(lp, 3))
          if (g.getAttribute('uv')) lg.setAttribute('uv', g.getAttribute('uv'))
          lg.setIndex(lid)
          lg.computeVertexNormals()
          lidGroup.add(new THREE.Mesh(lg, m.material))
        })
        root.add(lidGroup)
        // 先挂到 window 再 applyLid（applyLid 从 window.__lidGroup 取句柄，顺序反了就静默不动）
        window.__lidGroup = lidGroup
        // 初始姿态 = 网格存储姿态（angle0）；顺带按开合角决定屏幕亮灭（合盖熄屏）
        applyLid(lidAngle0)
        window.__lidMeta = { from: LID.from, to: LID.to, angle0: lidAngle0, hingeY: LID.hingeY, hingeZ: LID.hingeZ }
      }
      // 倒影副本（低不透明度；材质克隆避免共享）
      root.children.forEach(function (ch) {
        if (!ch.isMesh) return
        var mm = ch.material.clone()
        mm.transparent = true; mm.opacity = 0.11; mm.side = THREE.DoubleSide
        mm.depthWrite = false
        var r = new THREE.Mesh(ch.geometry, mm)
        reflGroup.add(r)
      })
      // 上盖倒影：整组克隆（转轴姿态由 setLid 同步到两个 group）
      if (lidGroup) {
        var rg = new THREE.Group()
        rg.position.copy(lidGroup.position)
        rg.rotation.copy(lidGroup.rotation)
        lidGroup.children.forEach(function (m) {
          var mm2 = m.material.clone()
          mm2.transparent = true; mm2.opacity = 0.11; mm2.side = THREE.DoubleSide; mm2.depthWrite = false
          rg.add(new THREE.Mesh(m.geometry, mm2))
        })
        reflGroup.add(rg)
        window.__lidReflGroup = rg
      }
      window.__photo.ready = true
      mark('t_mesh_built')
      // 预编译所有材质 program（14 材质 + 倒影克隆 ≈ 28 个 program，集显上首次编译要 ~1.6s；
      // 放到"加载中"遮罩后面，别让用户以为页面卡死）
      try { renderer.compile(scene, camera) } catch (e) {}
      autoQuality()                                // 遮罩仍盖着：测量期间别让用户看到黑屏
      var ld = document.getElementById('load')
      if (ld) ld.classList.add('off')
    }

    // 自适应画质：测**稳态**帧时间（首帧含纹理上传/RT 分配，可达 0.9s，不能作判据），
    // 取 3 帧中位数 > 60ms（软件渲染/弱 GPU 大窗口）才降到低档——否则用户在弱机器上拖动卡成幻灯片。
    function autoQuality() {
      var ms = 0
      try {
        gpuMs(function () { render() })              // 预热帧：纹理上传 + RT 分配
        var s = []
        for (var i = 0; i < 3; i++) s.push(gpuMs(function () { render() }))
        s.sort(function (a, b) { return a - b })
        ms = s[1]
      } catch (e) { ms = -1 }
      PERF.frame_ms = ms
      var slow = ms > 60
      setQuality(slow ? 'low' : 'high', true)
      var note = slow ? (' · 低画质（帧 ' + ms + 'ms，超采样已关）') : (' · 帧 ' + ms + 'ms')
      hud.textContent = hud.textContent.replace(/ · 帧 .*$/, '') + note
      PERF.auto_quality = slow ? 'low' : 'high'
    }

    // ---------- 地面 / 接触阴影 / 倒影（"悬浮在黑底上"是裁判认定的 CG 特征）----------
    var ground = new THREE.Mesh(
      new THREE.PlaneGeometry(4, 4),
      new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.55, metalness: 0.0 })
    )
    ground.rotation.x = -Math.PI / 2
    ground.position.y = -0.0004
    scene.add(ground)
    var shadowMesh = null
    new THREE.TextureLoader().load('./shadow-mask.png', function (tx) {
      var m = new THREE.Mesh(
        new THREE.PlaneGeometry(0.62, 0.44),
        // 用 alphaMap（L 图无 alpha 通道，当 map 用会渲染成硬边黑矩形——裁判点名的"硬边桌面板"）
        new THREE.MeshBasicMaterial({ color: 0x000000, alphaMap: tx, transparent: true, opacity: 0.62, depthWrite: false })
      )
      m.rotation.x = -Math.PI / 2
      m.position.set(0, 0.0002, 0.0)
      scene.add(m)
      shadowMesh = m
    })
    // 倒影：把网格按 y 镜像一份、低不透明度（真实产品图在黑底上一定有反射）
    var reflGroup = new THREE.Group()
    reflGroup.scale.y = -1
    reflGroup.position.y = -0.0008
    scene.add(reflGroup)

    // 背景渐变（无缝白背景靠上亮下暗的极淡渐变，纯色底会被读成"抠图"）
    var bgTex = null
    function makeBgGrad(top, bottom) {
      var c = document.createElement('canvas'); c.width = 4; c.height = 512
      var g = c.getContext('2d')
      var grd = g.createLinearGradient(0, 0, 0, 512)
      grd.addColorStop(0, '#' + new THREE.Color(top).getHexString())
      grd.addColorStop(1, '#' + new THREE.Color(bottom).getHexString())
      g.fillStyle = grd; g.fillRect(0, 0, 4, 512)
      var t = new THREE.CanvasTexture(c)
      t.colorSpace = THREE.SRGBColorSpace
      return t
    }
    function setPreset(name) {
      var p = PRESETS[name] || PRESETS.dark
      curPreset = name
      if (bgTex) { bgTex.dispose(); bgTex = null }
      if (p.bgComp) {
        // 背景走 shader 合成（不经 ACES）：底色真 255，且不受暗角/噪声调制
        scene.background = null
        ground.visible = false
        renderer.setClearColor(0x000000, 0)
        var u = postMat.uniforms
        // 直接用 sRGB 编码值（Vector3 没有 setHex；且合成发生在 oetf 之后，不能再做 sRGB→linear）
        var toV = function (v3, hex) { return v3.set(((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255) }
        toV(u.uBgA.value, p.bgGrad ? p.bgGrad[0] : p.bg)
        toV(u.uBgB.value, p.bgGrad ? p.bgGrad[1] : p.bg)
        u.uBgComp.value = 1.0
      } else {
        ground.visible = true
        renderer.setClearColor(0x000000, 1)
        postMat.uniforms.uBgComp.value = 0.0
        if (p.bgGrad) { bgTex = makeBgGrad(p.bgGrad[0], p.bgGrad[1]); scene.background = bgTex }
        else { scene.background = new THREE.Color(p.bg) }
      }
      ground.material.color.setHex(p.ground)
      ground.material.roughness = p.groundRough
      ground.material.metalness = p.groundMetal
      // 地面透明度：不透明地面会把 y<0 的倒影组整个挡住（实测 refl=0 与 0.45 逐像素完全相同）。
      // 半透明地面 = 真机产品照里那种「玻璃台面上的半透明镜像」（用户点名喜欢的那个效果）。
      var gop = p.groundOpacity == null ? 1 : p.groundOpacity
      ground.material.transparent = gop < 0.999
      ground.material.opacity = gop
      ground.material.needsUpdate = true
      if (shadowMesh) shadowMesh.material.opacity = p.shadow
      reflGroup.children.forEach(function (ch) {
        if (ch.material) ch.material.opacity = p.refl
        if (ch.children) ch.children.forEach(function (c2) { if (c2.material) c2.material.opacity = p.refl })
      })
      if (typeof POST !== 'undefined' && POST) POST.exposure = p.exposure
      bakeEnv(scaleEnv(p.env, ENV_SCALE))
      render()
      return { preset: name }
    }

    // ---------- 相机 ----------
    var curView = 'hero'
    // 轨道状态：鼠标拖动/滚轮改这三个量。视角表与 __photo.cam() 都会把它同步过来，
    // 所以「先按按钮取景 → 再手动微调」是连续的，不会跳。
    var ORBIT = { azim: 34, elev: 24, dist: 0.70, fov: 30, target: [0, 0.085, 0] }
    function syncOrbit(t) {
      var d = new THREE.Vector3().subVectors(camera.position, t)
      var dist = Math.max(1e-4, d.length())
      ORBIT.azim = Math.atan2(d.x, d.z) * 180 / Math.PI
      ORBIT.elev = Math.asin(Math.max(-1, Math.min(1, d.y / dist))) * 180 / Math.PI
      ORBIT.dist = dist
      ORBIT.fov = camera.fov
      ORBIT.target = [t.x, t.y, t.z]
    }
    function applyOrbit() {
      var el = Math.max(-89.5, Math.min(89.5, ORBIT.elev)) * Math.PI / 180
      var az = ORBIT.azim * Math.PI / 180
      var t = new THREE.Vector3(ORBIT.target[0], ORBIT.target[1], ORBIT.target[2])
      camera.fov = ORBIT.fov
      camera.position.set(
        t.x + ORBIT.dist * Math.cos(el) * Math.sin(az),
        t.y + ORBIT.dist * Math.sin(el),
        t.z + ORBIT.dist * Math.cos(el) * Math.cos(az)
      )
      camera.lookAt(t)
      camera.updateProjectionMatrix()
      reflGroup.visible = camera.position.y > 0.004
      POST.focus = ORBIT.dist
    }
    function applyView(name) {
      var v = VIEWS[name] || VIEWS.hero
      curView = VIEWS[name] ? name : 'hero'
      var az = v.azim * Math.PI / 180, el = v.elev * Math.PI / 180
      var t = v._center
        ? new THREE.Vector3(v._center.x + v.target[0], v._center.y + v.target[1], v._center.z + v.target[2])
        : new THREE.Vector3(v.target[0], v.target[1], v.target[2])
      var dist = v._scale ? v._scale * v.dist : v.dist
      camera.fov = v.fov
      camera.position.set(
        t.x + dist * Math.cos(el) * Math.sin(az),
        t.y + dist * Math.sin(el),
        t.z + dist * Math.cos(el) * Math.cos(az)
      )
      camera.lookAt(t)
      camera.updateProjectionMatrix()
      // 镜像组在 y<0（scale.y=-1）→ 底视图时它横在相机与模型之间（实测底视图穿透成透明）
      reflGroup.visible = !v.noRefl && camera.position.y > 0.004
      if (typeof POST !== 'undefined' && POST) POST.focus = camera.position.distanceTo(t)
      syncOrbit(t)
    }

    function resize(w, h) {
      renderer.setPixelRatio(1)          // 本机 dpr=0.8 → 画布只有 1132×672（细节被抹平）；强制 1:1
      renderer.setSize(w, h, false)
      canvas.style.width = w + 'px'
      canvas.style.height = h + 'px'
      camera.aspect = w / h
      camera.updateProjectionMatrix()
    }

    // ---------- 对外 API ----------
    // 屏幕网格定位：上盖拆分后屏幕三角形都在 lidGroup 里（局部坐标），
    // 所以必须递归找、并且取三角形最多的那块（0x191919 也被别的小件复用）。
    function findScreenMesh() {
      var sm = null, best = -1
      root.traverse(function (c) {
        if (!c.isMesh || !c.material || !c.material.color) return
        if (c.material.color.getHex() !== 0x191919) return
        if (!c.geometry.attributes.uv) return
        var n = c.geometry.index ? c.geometry.index.count : c.geometry.attributes.position.count
        if (n > best) { best = n; sm = c }
      })
      return sm
    }

    // ---------- 上盖开合（静态出图 / 交互 / 演示共用一套） ----------
    // lidAngle0 = 网格存储的开盖角（page-mesh.mjs 写入 mesh JSON 的 lid.angle）。
    // 上盖局部坐标已按 R(-angle0) 反解，所以「渲染成网格姿态」= rotation.x 取 -lidAngle0。
    // 旧版少了这一步，任何 angle0≠0 的网格静态出图都会静默合盖（2026-09-10 修）。
    var lidDeg = 0, lidAnimId = 0
    var BUILD = 'r14'              // HUD 里显示：用于识别浏览器缓存的旧页面（本轮踩过）
    var SCREEN_BASE = 1.40          // 屏幕自发光标定值（对贴图实测均值 222）
    function lidScreen(deg) {
      // 合盖息屏：0° 全灭、≥12° 全亮（真机合盖屏幕不发光；旧版合盖后光会从盖缝漏出来）
      if (!window.__screenMat) return
      var k = Math.max(0, Math.min(1, (deg - 3) / 9))
      window.__screenMat.emissiveIntensity = SCREEN_BASE * k
    }
    function applyLid(deg) {
      var lg = window.__lidGroup
      if (!lg) return null
      var r = -deg * Math.PI / 180
      lg.rotation.x = r
      if (window.__lidReflGroup) window.__lidReflGroup.rotation.x = r
      lidDeg = deg
      lidScreen(deg)
      return deg
    }

    window.__photo = {
      ready: false,
      views: Object.keys(VIEWS),
      viewTable: VIEWS,            // 机位表本体（demo-record 等工具要用真实参数，不是只有名字）
      presets: Object.keys(PRESETS),
      // 调试/QA 用（page-probe 读材质表与包围盒；不影响渲染）
      scene: scene,
      root: root,
      camera: camera,
      renderer: renderer,
      // 真 GPU 耗时测量：gl.finish() 强制同步（render() 的 JS 侧只提交命令，不等 GPU）
      gpuMs: gpuMs,
      render: function () { render() },
      quality: function (q) { return setQuality(q) },
      // 调试/录制用：直接设 RT 超采样倍率（1080p 输出时用它找「画质 vs 帧率」的拐点）
      rtScale: function (k) {
        if (k) { rtScale = Math.max(1, Math.min(4, Number(k) || 1)); if (rt) { rt.dispose(); rt = null } render() }
        return rtScale
      },
      // 屏幕活动区在**当前视口**的像素包围盒（跨视角一致性自检用：同一台真机所有视角
      // 屏幕内容必然一致，裁同一块区域比对；返回 null = 本视角看不到屏幕）
      // 屏幕活动区四角在**当前视口**的像素坐标 + 对应 UV（跨视角一致性比对用：
      // 把各视角的屏幕区域透视矫正到同一张「内容空间」再比像素，grazing 视角也能比）
      screenQuad: function () {
        var sm = findScreenMesh()
        if (!sm) return null
        var g = sm.geometry, pos = g.attributes.position.array, uv = g.attributes.uv.array
        var idx = g.index ? g.index.array : null
        var n = idx ? idx.length : pos.length / 3
        sm.updateMatrixWorld(true)
        // 四角 = UV 极值顶点（比"最近 UV 角点"稳：不受共享顶点数组/焊接影响）
        // (0,0)=min(u+v)  (1,0)=max(u-v)  (1,1)=max(u+v)  (0,1)=min(u-v)
        var best = [{ d: 1e9, vi: -1 }, { d: -1e9, vi: -1 }, { d: -1e9, vi: -1 }, { d: 1e9, vi: -1 }]
        for (var k = 0; k < n; k++) {
          var vi = idx ? idx[k] : k
          var u = uv[vi * 2], v = uv[vi * 2 + 1]
          var sum = u + v, dif = u - v
          if (sum < best[0].d) { best[0].d = sum; best[0].vi = vi }
          if (dif > best[1].d) { best[1].d = dif; best[1].vi = vi }
          if (sum > best[2].d) { best[2].d = sum; best[2].vi = vi }
          if (dif < best[3].d) { best[3].d = dif; best[3].vi = vi }
        }
        var want = [[0, 0], [1, 0], [1, 1], [0, 1]]
        var v3 = new THREE.Vector3()
        var out = [], world = []
        for (var j2 = 0; j2 < 4; j2++) {
          var vv = best[j2].vi
          if (vv < 0) return null
          // 屏幕在 lidGroup 里时顶点是**上盖局部坐标** → 必须过 matrixWorld 才是世界坐标
          world.push(new THREE.Vector3(pos[vv * 3], pos[vv * 3 + 1], pos[vv * 3 + 2]).applyMatrix4(sm.matrixWorld))
          v3.copy(world[j2]).project(camera)
          out.push({
            u: want[j2][0], v: want[j2][1],
            px: (v3.x * 0.5 + 0.5) * canvas.width,
            py: (1 - (v3.y * 0.5 + 0.5)) * canvas.height,
          })
        }
        // 屏幕是否真的看得见（底视/背面视角屏幕被上盖挡住 → 返回 null，避免一致性自检误报）
        var ctr = world[0].clone().add(world[1]).add(world[2]).add(world[3]).multiplyScalar(0.25)
        var dir = ctr.clone().sub(camera.position).normalize()
        var rc = new THREE.Raycaster(camera.position, dir, 0.001, 100)
        var hits = rc.intersectObjects(root.children, true)   // true=递归（上盖是子 Group）
        if (!hits.length || hits[0].object !== sm) return null
        return out
      },
      screenBox: function () {
        var sm = findScreenMesh()
        if (!sm) return null
        var g = sm.geometry, pos = g.attributes.position.array
        sm.updateMatrixWorld(true)
        var bb = { min: new THREE.Vector3(1e9, 1e9, 1e9), max: new THREE.Vector3(-1e9, -1e9, -1e9) }
        var idx = g.index ? g.index.array : null
        var n = idx ? idx.length : pos.length / 3
        var v = new THREE.Vector3()
        for (var k = 0; k < n; k++) {
          var vi = (idx ? idx[k] : k) * 3
          v.set(pos[vi], pos[vi + 1], pos[vi + 2]).applyMatrix4(sm.matrixWorld)
          if (v.x < bb.min.x) bb.min.x = v.x; if (v.x > bb.max.x) bb.max.x = v.x
          if (v.y < bb.min.y) bb.min.y = v.y; if (v.y > bb.max.y) bb.max.y = v.y
          if (v.z < bb.min.z) bb.min.z = v.z; if (v.z > bb.max.z) bb.max.z = v.z
        }
        var pts = []
        for (var i = 0; i < 8; i++) {
          v.set(i & 1 ? bb.max.x : bb.min.x, i & 2 ? bb.max.y : bb.min.y, i & 4 ? bb.max.z : bb.min.z).project(camera)
          pts.push([(v.x * 0.5 + 0.5) * canvas.width, (1 - (v.y * 0.5 + 0.5)) * canvas.height])
        }
        var xs = pts.map(function (p) { return p[0] }), ys = pts.map(function (p) { return p[1] })
        var x0 = Math.max(0, Math.min.apply(null, xs)), y0 = Math.max(0, Math.min.apply(null, ys))
        var x1 = Math.min(canvas.width, Math.max.apply(null, xs)), y1 = Math.min(canvas.height, Math.max.apply(null, ys))
        if (x1 - x0 < 8 || y1 - y0 < 8) return null
        return { x0: x0, y0: y0, x1: x1, y1: y1 }
      },
      setBg: function (hex) { scene.background = new THREE.Color(hex); render() },
      preset: function (name) { return setPreset(name) },
      // 环境强度倍率（铝面亮度校准）：重烘 cubemap，不改背景/地面
      envScale: function (k) { ENV_SCALE = k; bakeEnv(scaleEnv(PRESETS[curPreset].env, ENV_SCALE)); render(); return ENV_SCALE },
      // 换网格（开盖/闭合两态共用本页）
      loadMesh: function (url, cb) {
        fetchMesh(url, function (txt) {
          while (root.children.length) root.remove(root.children[0])
          while (reflGroup.children.length) reflGroup.remove(reflGroup.children[0])
          meshReady = false
          window.__photo.ready = false
          try { buildMesh(JSON.parse(txt)); window.__meshLoaded = url; if (cb) cb(true) }
          catch (e) { hud.textContent = 'mesh parse failed: ' + e.message; if (cb) cb(false) }
        }, function (err) { hud.textContent = 'mesh load failed (' + err + ')'; if (cb) cb(false) })
      },
      // 相机参数（每次拍摄可覆写）：noise 传感器噪声幅度、vignette 暗角、ca 色散、
      // aperture 景深强度（0=全清晰）、focus 对焦距离（米，缺省自动=到注视点距离）、
      // exposure 曝光。seed 缺省每次自增 → 六张图噪声底各不相同（裁判点名的破绽）。
      post: function (o) { if (o) Object.keys(o).forEach(function (k) { if (k in POST) POST[k] = o[k] }); render(); return JSON.parse(JSON.stringify(POST)) },
      shoot: function (name, w, h, o) {
        hud.style.display = 'none'          // 截图里不能有调试文字
        if (w && h) resize(w, h)
        applyView(name)
        if (o && o.focus != null) POST.focus = o.focus
        shotSeed = (o && o.seed != null) ? (o.seed >>> 0) : ((shotSeed * 1664525 + 1013904223) >>> 0)
        render()
        return { view: name, w: canvas.width, h: canvas.height, seed: shotSeed, post: JSON.parse(JSON.stringify(POST)) }
      },
      hud: function (on) { hud.style.display = on ? '' : 'none' },
      // ---------- 开盖 / 合盖 ----------
      // 上盖是刚体：局部坐标已按 R(-angle0) 反解，绕转轴改 rotation.x 即可（THREE 取 -θ）。
      // theta=0 闭合、100 全开（= 网格姿态）。合盖时屏幕必须熄灭：真机合盖息屏，
      // 而且旧版合盖后屏幕自发光会从盖缝里漏出来（用户 2026-09-10 点名）。
      lid: function () { return lidDeg },
      setLid: function (deg) { return applyLid(deg) },
      animLid: function (to, ms) {
        var from = lidDeg, t0 = performance.now()
        ms = Math.max(120, ms || 900)
        if (lidAnimId) cancelAnimationFrame(lidAnimId)
        return new Promise(function (done) {
          function step() {
            var t = Math.min(1, (performance.now() - t0) / ms)
            var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2   // easeInOutQuad
            applyLid(from + (to - from) * e)
            renderLive()
            if (t < 1) { lidAnimId = requestAnimationFrame(step) } else { lidAnimId = 0; endLive(); done(to) }
          }
          lidAnimId = requestAnimationFrame(step)
        })
      },
      toggleLid: function (ms) {
        // 目标角从 mesh JSON 的 lid.angle 取（lidAngle0 是 buildMesh 内的局部变量，闭包里取不到）
        var a0 = (window.__lidMeta && window.__lidMeta.angle0) || 100
        return window.__photo.animLid(lidDeg > 50 ? 0 : a0, ms || 900)
      },
      lidRange: function () { return window.__lidMeta || null },
      // 亮屏：屏幕材质是 emissive；0=全黑，1.4=标定亮度（对贴图实测 222 均值）
      screenOn: function (k) {
        if (!window.__screenMat) return null
        SCREEN_BASE = k
        lidScreen(lidDeg)          // 仍受开合角约束：合盖时保持熄灭
        return k
      },
      // 倒影（用户点名喜欢的「半透明镜像」）：0..1
      reflOpacity: function (k) {
        reflGroup.children.forEach(function (ch) {
          if (ch.material) ch.material.opacity = k
          if (ch.children) ch.children.forEach(function (c2) { if (c2.material) c2.material.opacity = k })
        })
        return k
      },
      // 线框（演示「渲染」过程用）
      wireframe: function (on) {
        root.traverse(function (c) { if (c.isMesh && c.material) c.material.wireframe = !!on })
        return on
      },
      cam: function (o) {              // 任意机位（排查用）：{azim,elev,dist,target,fov}
        hud.style.display = 'none'
        var v = { azim: o.azim || 0, elev: o.elev || 0, dist: o.dist || 0.6, fov: o.fov || 30,
                  target: o.target || [0, 0.05, 0] }
        var az = v.azim * Math.PI / 180, el = v.elev * Math.PI / 180
        var t = new THREE.Vector3(v.target[0], v.target[1], v.target[2])
        camera.fov = v.fov
        camera.position.set(t.x + v.dist * Math.cos(el) * Math.sin(az), t.y + v.dist * Math.sin(el),
                            t.z + v.dist * Math.cos(el) * Math.cos(az))
        camera.lookAt(t); camera.updateProjectionMatrix()
        POST.focus = camera.position.distanceTo(t)
        syncOrbit(t)
        render()
        return { ok: true }
      },
      build: buildMesh,
    }

    // ---------- 相机写实后处理（景深 / 色散 / 暗角 / 传感器噪声 / ACES / sRGB）----------
    // 裁判三轮一致的证据：「六张图噪声底完全一致 + 表面零高频噪声」。真实照片哪怕
    // 影棚低 ISO 也带传感器噪声、镜头暗角、轻微色散与景深——这些此前全靠一张 grain.png
    // 全屏叠加（六张同源，被一眼识破）。这里改成真正的后处理链。
    // 注意：three.js 渲染到 RenderTarget 时**不做色调映射**（源码 toneMapping 参数在
    // renderTarget !== null 时取 NoToneMapping）→ ACES 与 sRGB 编码必须由本 shader 负责。
    var rt = null
    var postScene = new THREE.Scene()
    var postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
    var postMat = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: null }, tDepth: { value: null },
        uNear: { value: 0.01 }, uFar: { value: 100 },
        uFocus: { value: 0.6 }, uAperture: { value: 0.0 }, uMaxBlur: { value: 0.014 },
        uRes: { value: new THREE.Vector2(1416, 840) },
        uNoise: { value: 0.0 }, uSeed: { value: 1.0 },
        uVignette: { value: 0.0 }, uCA: { value: 0.0 }, uExposure: { value: 1.0 },
        // 背景合成（背景不参与 ACES 色调映射：白底产品照的底色是真 255，
        // 经 ACES 的纯白只能到 221 → 与参考图对不上，故按 sRGB 值直接合成）
        uBgA: { value: new THREE.Vector3(0, 0, 0) }, uBgB: { value: new THREE.Vector3(0, 0, 0) },
        uBgComp: { value: 0.0 },
      },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
      fragmentShader: [
        'precision highp float;',
        'varying vec2 vUv;',
        'uniform sampler2D tDiffuse; uniform sampler2D tDepth;',
        'uniform float uNear, uFar, uFocus, uAperture, uMaxBlur, uNoise, uSeed, uVignette, uCA, uExposure;',
        'uniform vec3 uBgA, uBgB; uniform float uBgComp;',
        'uniform vec2 uRes;',
        'float lin(float d){ float z = d * 2.0 - 1.0; return (2.0*uNear*uFar)/(uFar+uNear - z*(uFar-uNear)); }',
        // 整数域哈希（Dave Hoskins hash12 变体）——旧版 sin(dot(p,127.1,311.7))*43758.5 在 uv*uRes
        // 到 ~1400 时 sin 大参数精度丢失，产生周期性斜向点阵（裁判 E5 实测 256² FFT 谱峰 1029–1682× 均值）。
        'float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }',
        'vec3 aces(vec3 color){',
        '  const mat3 IN = mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);',
        '  const mat3 OUT = mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);',
        '  color *= uExposure / 0.6;',
        '  color = IN * color;',
        '  vec3 a = color * (color + 0.0245786) - 0.000090537;',
        '  vec3 b = color * (0.983729 * color + 0.4329510) + 0.238081;',
        '  color = OUT * (a / b);',
        '  return clamp(color, 0.0, 1.0);',
        '}',
        'vec3 oetf(vec3 c){ return mix(pow(max(c, vec3(0.0)), vec3(0.41666)) * 1.055 - vec3(0.055), c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308)))); }',
        'const vec2 PD[16] = vec2[16](',
        '  vec2(-0.6134, 0.2591), vec2(0.2649, 0.6124), vec2(0.6105, -0.2732), vec2(-0.2591, -0.6124),',
        '  vec2(0.1546, 0.1583), vec2(-0.1583, 0.1546), vec2(0.1583, -0.1546), vec2(-0.1546, -0.1583),',
        '  vec2(0.4320, 0.4320), vec2(-0.4320, 0.4320), vec2(0.4320, -0.4320), vec2(-0.4320, -0.4320),',
        '  vec2(0.0, 0.7236), vec2(0.7236, 0.0), vec2(0.0, -0.7236), vec2(-0.7236, 0.0));',
        'void main(){',
        '  vec2 uv = vUv;',
        '  vec3 col;',
        '  if (uAperture > 0.0001) {',
        '    float zd = lin(texture2D(tDepth, uv).x);',
        '    float coc = clamp(abs(zd - uFocus) / max(zd, 0.02) * uAperture, 0.0, 1.0);',
        '    float rpx = coc * uMaxBlur;',
        '    col = vec3(0.0); float wsum = 0.0;',
        '    for (int i = 0; i < 16; i++) {',
        '      vec2 off = PD[i] * rpx;',
        '      float zt = lin(texture2D(tDepth, uv + off).x);',
        '      float cocT = clamp(abs(zt - uFocus) / max(zt, 0.02) * uAperture, 0.0, 1.0);',
        '      float w = max(clamp(cocT - length(PD[i]) * coc * 0.55, 0.0, 1.0), (1.0 - coc) * (i == 0 ? 1.0 : 0.0));',
        '      col += texture2D(tDiffuse, uv + off).rgb * w; wsum += w;',
        '    }',
        '    col /= max(wsum, 1e-4);',
        '  } else {',
        '    col = texture2D(tDiffuse, uv).rgb;',
        '  }',
        '  if (uCA > 0.0) {',
        '    vec2 dir = uv - 0.5; vec2 o = dir * dot(dir, dir) * uCA;',
        '    col.r = texture2D(tDiffuse, uv + o).r; col.b = texture2D(tDiffuse, uv - o).b;',
        '  }',
        '  vec2 dv = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);',
        '  col *= 1.0 - uVignette * pow(clamp(length(dv) / 0.72, 0.0, 1.0), 2.2);',
        '  col = aces(col);',
        '  col = oetf(col);',
        '  if (uBgComp > 0.5) {',
        '    vec3 bg = mix(uBgB, uBgA, clamp(uv.y, 0.0, 1.0));',
        '    float a = texture2D(tDiffuse, uv).a;',
        '    col = mix(bg, col, clamp(a, 0.0, 1.0));',
        '  }',
        '  if (uNoise > 0.0) {',
        // seed 必须先折进小范围：uSeed 是 shotSeed（~2e7 整数），uSeed*37 ≈ 7.5e8，
        // float32 在该量级的分辨率 ~64 → fract() 全被吃掉 → 噪声退化成常数（实测 on/off 差恒为 -68）。
        '    vec2 so1 = vec2(fract(uSeed * 0.000103), fract(uSeed * 0.000071)) * 37.0;',
        '    vec2 so2 = vec2(fract(uSeed * 0.000061), fract(uSeed * 0.000037)) * 91.0;',
        '    float n = hash(uv * uRes + so1) - 0.5;',
        '    float n2 = hash(uv * uRes * 0.47 + so2) - 0.5;',
        '    float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));',
        '    float amp = uNoise * (0.45 + 0.55 * (1.0 - sqrt(clamp(lum, 0.0, 1.0))));',
        '    col += (n * 0.78 + n2 * 0.22) * amp;',
        // 色度噪点（参考图暗部实测有轻微彩色斑点；亮度项占比 ~0.18 保持 chroma/luma 比接近真图）
        '    float c1 = hash(uv * uRes * 1.31 + so2) - 0.5;',
        '    float c2 = hash(uv * uRes * 1.77 + so1) - 0.5;',
        '    col.r += c1 * amp * 0.18; col.b += c2 * amp * 0.18;',
        '  }',
        '  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
        '}',
      ].join('\n'),
      depthTest: false, depthWrite: false,
    })
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat))

    // RT 用 2× 分辨率 + 双线性采样 = 2× 超采样（RT 不开 MSAA，避免 depthTexture 解析歧义）
    var rtScale = 2
    var QUALITY = 'high'
    // 真 GPU 耗时：render() 的 JS 侧只提交命令（异步），必须 gl.finish() 才拿到真实帧时间
    function gpuMs(fn) {
      var gl = renderer.getContext(), t = performance.now()
      if (fn) fn()
      gl.finish()
      return Math.round((performance.now() - t) * 10) / 10
    }
    // 画质档：低档 = 关 2× 超采样 + 关景深（软件渲染/弱 GPU 上这是能不能拖动的前提）
    function setQuality(q, silent) {
      QUALITY = (q === 'low') ? 'low' : 'high'
      var want = QUALITY === 'low' ? 1 : 2
      if (rtScale !== want) {
        rtScale = want
        if (rt) { rt.dispose(); rt = null }
      }
      POST.aperture = QUALITY === 'low' ? 0 : 0
      POST.noise = QUALITY === 'low' ? 0.022 : 0.030
      render()
      var b = document.getElementById('btnQ')
      if (b) b.textContent = '画质：' + (QUALITY === 'low' ? '低' : '高')
      if (!silent && hud) hud.style.display = ''
      return QUALITY
    }
    function ensureRT(w, h) {
      var tw = Math.round(w * rtScale), th = Math.round(h * rtScale)
      if (rt && rt.width === tw && rt.height === th) return
      if (rt) rt.dispose()
      var depth = new THREE.DepthTexture(tw, th)
      depth.type = THREE.UnsignedIntType
      // samples>0 = MSAA（离线录制可开：rtScale 1 也能得到干净边缘）
      rt = new THREE.WebGLRenderTarget(tw, th, { type: THREE.HalfFloatType, depthTexture: depth, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, samples: (window.__rtSamples || 0) })
      postMat.uniforms.tDiffuse.value = rt.texture
      postMat.uniforms.tDepth.value = depth
      postMat.uniforms.uRes.value.set(w, h)
    }

    // POST：每次拍摄可覆写（景深/噪声/暗角/色散都是"相机参数"，不是每张都一样的常数）
    var POST = { noise: 0.030, vignette: 0.20, ca: 0.0016, aperture: 0.0, focus: 0.6, maxBlur: 0.014, exposure: 1.0 }
    var shotSeed = 1
    // 拖动/滚轮期间的快速预览态：只跳过景深/色散/噪声（这三项是后处理里最贵的），
    // RT 尺寸不动 → 不会反复分配 2× 半浮点缓冲（那样反而更卡）。松手/停滚后出全质量图。
    var LIVE = false
    function render() {
      var w = canvas.width, h = canvas.height
      if (w < 8 || h < 8) return
      var t0 = performance.now()
      ensureRT(w, h)
      var u = postMat.uniforms
      u.uNear.value = camera.near; u.uFar.value = camera.far
      u.uFocus.value = POST.focus
      u.uAperture.value = LIVE ? 0 : POST.aperture
      u.uMaxBlur.value = POST.maxBlur
      u.uNoise.value = LIVE ? 0 : POST.noise
      u.uVignette.value = LIVE ? POST.vignette * 0.7 : POST.vignette
      u.uCA.value = LIVE ? 0 : POST.ca
      u.uExposure.value = POST.exposure * (PRESETS[curPreset] ? 1.0 : 1.0)
      u.uSeed.value = shotSeed
      renderer.setRenderTarget(rt)
      renderer.clear()
      renderer.render(scene, camera)
      renderer.setRenderTarget(null)
      renderer.render(postScene, postCam)
      PERF.render_ms = Math.round((performance.now() - t0) * 10) / 10
      PERF.renders++
      if (!PERF.t_first_render) mark('t_first_render')
    }

    // 加载网格（静态文件，同源；不用 fetch 走接口，避免 WSL2 转发抽风）
    // 网格加载：优先 gzip（2.58MB→0.36MB，7×；WSL→Windows 的 localhost 转发对 2.6MB 要 0.4–3.2s），
    // 浏览器自带 DecompressionStream 解压 → 不需要服务器加 Content-Encoding。失败则回退明文 JSON。
    function plainXHR(url, onText, onErr) {
      var x = new XMLHttpRequest()
      x.open('GET', url, true)                                            // 禁缓存：几何每轮都在变
      x.onload = function () {
        if (x.status >= 200 && x.status < 300) onText(x.responseText, 'plain')
        else onErr('HTTP ' + x.status)
      }
      x.onerror = function () { onErr('network') }
      x.send()
    }
    function fetchMesh(url, onText, onErr) {
      var ts = '?t=' + Date.now()
      if (!window.DecompressionStream) { plainXHR(url + ts, onText, onErr); return }
      fetch(url + '.gz' + ts).then(function (r) {
        if (!r.ok) throw new Error('gz HTTP ' + r.status)
        return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text()
      }).then(function (t) { onText(t, 'gzip') })
        .catch(function () { plainXHR(url + ts, onText, onErr) })
    }
    fetchMesh('./macbook-current.json', function (txt, how) {
      mark('t_mesh_fetched'); PERF.mesh_bytes = txt.length; PERF.mesh_enc = how
      try { buildMesh(JSON.parse(txt)) } catch (e) { hud.textContent = 'mesh parse failed: ' + e.message }
    }, function (err) { hud.textContent = 'mesh load failed (' + err + ')' })
    // 启动即按窗口尺寸出图（旧版固定 1600×1000 → 窗口小于该尺寸时画布被裁切，
    // 用户打开页面只看到一片黑）
    resize(Math.max(320, window.innerWidth), Math.max(240, window.innerHeight))
    applyView('hero')
    render()

    // ---------- 交互（给人在浏览器里看模型用；自动化走 __photo API 不受影响） ----------
    var VIEW_KEYS = { '1': 'hero', '2': 'screenfront', '3': 'kb', '4': 'closedtop', '5': 'ports', '6': 'bottom', '7': 'side', '8': 'front', '9': 'top' }
    var PRESET_KEYS = { q: 'white', w: 'dark', e: 'grey' }
    var liveTimer = 0
    function renderLive() {                    // 拖动/滚轮：先快出图，停 200ms 后补全质量
      LIVE = true
      render()
      clearTimeout(liveTimer)
      liveTimer = setTimeout(function () { LIVE = false; render() }, 200)
    }
    function endLive() {
      clearTimeout(liveTimer)
      if (LIVE) { LIVE = false; render() }
    }
    window.addEventListener('keydown', function (ev) {
      var k = ev.key.toLowerCase()
      if (VIEW_KEYS[k]) { applyView(VIEW_KEYS[k]); render(); refreshBtns(); return }
      if (PRESET_KEYS[k]) { setPreset(PRESET_KEYS[k]); applyView(curView); render(); refreshBtns(); return }
      if (k === 'h') { hud.style.display = hud.style.display === 'none' ? '' : 'none' }
      if (k === 'l') { window.__photo.toggleLid(900); return }
      if (k === ' ') { window.__photo.toggleLid(900); ev.preventDefault(); return }
    })
    window.addEventListener('resize', function () {
      resize(Math.max(320, window.innerWidth), Math.max(240, window.innerHeight))
      applyOrbit()                             // 保留用户当前机位（旧版会跳回预设视角）
      render()
    })

    // ---------- 鼠标轨道控制 ----------
    var drag = null
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault() })
    canvas.addEventListener('pointerdown', function (e) {
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, pan: (e.button === 2 || e.shiftKey) }
      canvas.classList.add('dragging')
      try { canvas.setPointerCapture(e.pointerId) } catch (err) {}
      e.preventDefault()
    })
    canvas.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y
      drag.x = e.clientX; drag.y = e.clientY
      if (drag.pan) {
        // 沿相机的右/上轴平移注视点；速度随距离缩放（近景慢、远景快）
        var right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion)
        var up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion)
        var k = ORBIT.dist * 0.0018
        for (var i = 0; i < 3; i++) {
          var a = i === 0 ? right.x : (i === 1 ? right.y : right.z)
          var b = i === 0 ? up.x : (i === 1 ? up.y : up.z)
          ORBIT.target[i] += (-a * dx + b * dy) * k
        }
      } else {
        ORBIT.azim -= dx * 0.30
        ORBIT.elev += dy * 0.30
      }
      applyOrbit()
      renderLive()
    })
    function stopDrag(e) {
      if (!drag) return
      drag = null
      canvas.classList.remove('dragging')
      try { if (e && e.pointerId != null) canvas.releasePointerCapture(e.pointerId) } catch (err) {}
      endLive()
    }
    canvas.addEventListener('pointerup', stopDrag)
    canvas.addEventListener('pointercancel', stopDrag)
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault()
      ORBIT.dist = Math.max(0.10, Math.min(3.0, ORBIT.dist * Math.exp(e.deltaY * 0.0012)))
      applyOrbit()
      renderLive()
    }, { passive: false })

    // ---------- 按钮面板 ----------
    var VIEW_LABEL = { hero: '3/4 视角', front: '正面', closedtop: '闭合俯视', screenfront: '屏幕正面',
                       screen34: '屏幕 3/4', kb: '键盘俯视', top: '顶视', ports: '接口特写', portstele: '接口长焦', sidetele: '侧面长焦',
                       side: '侧面', lid: '上盖特写', bottom: '底面',
                       hinge: '转轴特写', hingel: '转轴侧面', bezel: '边框特写', cornerL: '左前角', cornerR: '右前角', deckL: '台面左前角', deckR: '台面右前角', leftseam: '合盖侧缝', portclose: '接口特写', groove: '前缘凹槽', groove34: '前缘凹槽 3/4' }
    var VIEW_ORDER = ['hero', 'front', 'closedtop', 'screenfront', 'screen34', 'kb', 'top', 'ports', 'side', 'lid', 'hinge', 'hingel', 'bezel', 'cornerL', 'cornerR', 'deckL', 'deckR', 'leftseam', 'portclose', 'groove', 'groove34', 'bottom']
    var PRESET_LABEL = { white: '白底', dark: '深色', grey: '灰底' }
    var rowView = document.getElementById('rowView')
    var rowPreset = document.getElementById('rowPreset')
    VIEW_ORDER.forEach(function (name) {
      if (!VIEWS[name]) return
      var b = document.createElement('button')
      b.textContent = VIEW_LABEL[name] || name
      b.dataset.view = name
      b.onclick = function () { applyView(name); render(); refreshBtns() }
      rowView.appendChild(b)
    })
    Object.keys(PRESETS).forEach(function (name) {
      var b = document.createElement('button')
      b.textContent = PRESET_LABEL[name] || name
      b.dataset.preset = name
      b.onclick = function () { setPreset(name); applyOrbit(); render(); refreshBtns() }
      rowPreset.appendChild(b)
    })
    function refreshBtns() {
      Array.prototype.forEach.call(rowView.children, function (b) {
        b.className = (b.dataset.view === curView) ? 'on' : ''
      })
      Array.prototype.forEach.call(rowPreset.children, function (b) {
        b.className = (b.dataset.preset === curPreset) ? 'on' : ''
      })
    }
    document.getElementById('btnLid').onclick = function () { window.__photo.toggleLid(900) }
    document.getElementById('btnReset').onclick = function () { applyView(curView); render(); refreshBtns() }
    document.getElementById('btnQ').onclick = function () {
      setQuality(QUALITY === 'high' ? 'low' : 'high')
      applyOrbit()
      render()
    }
    document.getElementById('btnSave').onclick = function () {
      var a = document.createElement('a')
      a.download = 'macbook-' + curView + '.png'
      a.href = canvas.toDataURL('image/png')
      a.click()
    }
    document.getElementById('btnHud').onclick = function () {
      hud.style.display = hud.style.display === 'none' ? '' : 'none'
    }
    refreshBtns()
  }

  function loadCdn(i) {
    if (i >= CDNS.length) { hud.textContent = 'three.js CDN 加载失败'; return }
    var s = document.createElement('script')
    s.src = CDNS[i]
    s.onload = function () { try { mark('t_three'); boot(window.THREE) } catch (e) { hud.textContent = 'boot failed: ' + e.message } }
    s.onerror = function () { loadCdn(i + 1) }
    document.head.appendChild(s)
  }
  loadCdn(0)
})()
</script>
</body>
</html>
