<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时 3D 预览 · 当前作品独立页 — Genshin Model Studio</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151c; font-family: system-ui, sans-serif; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 2; max-width: 330px;
    color: #dfe6ee; background: rgba(16, 21, 28, 0.8); border: 1px solid #2b3542;
    border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.7;
  }
  #hud h1 { font-size: 14px; margin: 0 0 6px; }
  #hud .hint { color: #93a1b0; font-size: 12px; }
  #legend { margin-top: 6px; font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #status { color: #ffd479; font-size: 12px; margin-top: 6px; }
  #status.err { color: #ff7b7b; }
</style>
</head>
<body>
<div id="view"><canvas id="canvas"></canvas></div>
<div id="hud">
  <h1>当前作品 · 3D 预览独立页</h1>
  <div>🖱 左键拖拽旋转 · 滚轮缩放 · 移动端单指拖拽 / 双指捏合</div>
  <div class="hint">与主页面（localhost:8787）共用同一份作品数据（localStorage），刷新本页即同步最新作品。地面网格：y=0 地面；坐标轴 x=红 / y=绿 / z=蓝。</div>
  <div id="legend"></div>
  <div id="status">加载 Three.js（CDN）…</div>
</div>

<script src="./preview.js"></script>
<script>
(function () {
  'use strict'

  var statusEl = document.getElementById('status')
  var legendEl = document.getElementById('legend')

  // 与主页面同一 localStorage 键：{ version, strokes, options }
  var LS_KEY = 'gms.draw.work.v1'

  function loadWork() {
    var raw = null
    try { raw = localStorage.getItem(LS_KEY) } catch (e) { return null }
    if (!raw) return null
    try {
      var work = JSON.parse(raw)
      if (!work || !Array.isArray(work.strokes) || !work.options) return null
      return work
    } catch (e) { return null }
  }

  function renderLegend(strokes) {
    var rows = []
    strokes.forEach(function (s, i) {
      if (s.color) rows.push('<div><span class="dot" style="background:#' + String(s.color).replace('0x', '') + '"></span>第 ' + i + ' 笔</div>')
    })
    legendEl.innerHTML = rows.length ? rows.join('') : '<div class="hint">（当前作品未使用笔画颜色）</div>'
  }

  // Three.js 多源 CDN fallback（unpkg → jsdelivr）
  var CDNS = [
    'https://unpkg.com/three@0.160.0/build/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
  ]
  var cdnIdx = 0

  function boot() {
    if (typeof window.createPreview !== 'function') {
      statusEl.className = 'err'
      statusEl.textContent = 'preview.js 未加载（./preview.js 需与本页同目录）'
      return
    }
    try {
      var preview = window.createPreview(document.getElementById('canvas'))
      window.__preview = preview // 供脚本/调试访问
      var work = loadWork()
      if (!work) {
        preview.setItems([])
        statusEl.className = 'err'
        statusEl.textContent = '未找到作品数据（localStorage 键 ' + LS_KEY + '）。请先在主页面作画（自动保存），再刷新本页。'
        return
      }
      renderLegend(work.strokes)
      statusEl.textContent = '正在生成模型（POST /api/draw-model）…'
      fetch('/api/draw-model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ strokes: work.strokes, options: work.options }),
      })
        .then(function (res) {
          if (!res.ok) throw new Error('生成接口 HTTP ' + res.status)
          return res.json()
        })
        .then(function (data) {
          preview.setItems(data.items || [])
          statusEl.textContent = '✓ 已加载当前作品：' + work.strokes.length + ' 笔笔画 · ' + (data.items || []).length + ' 个元件（与主页面一致）'
        })
        .catch(function (err) {
          statusEl.className = 'err'
          statusEl.textContent = '模型生成失败：' + err.message + '（请确认通过 localhost:8787 访问本页）'
        })
    } catch (err) {
      statusEl.className = 'err'
      statusEl.textContent = '初始化失败：' + err.message
    }
  }

  function loadCdn() {
    if (cdnIdx >= CDNS.length) {
      statusEl.className = 'err'
      statusEl.textContent = 'Three.js CDN 全部加载失败（当前环境可能无法访问外网）。' +
        '请检查网络，或改用 unpkg / jsdelivr 可用的镜像地址。'
      return
    }
    var s = document.createElement('script')
    s.src = CDNS[cdnIdx++]
    s.onload = boot
    s.onerror = loadCdn
    document.head.appendChild(s)
  }

  loadCdn()
})()
</script>
</body>
</html>
